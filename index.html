    /** Auto king-save uses ONLY reserve future (one-shot). Hand futures must be played manually. */
    function findFutureCard(owner){
      const res = owner==='white' ? playerReserve : aiReserve;
      if(res && res.item && res.item.type==='future') return {where:'reserve', owner};
      return null;
    }
    function consumeFutureCard(ref){
      if(!ref) return;
      if(ref.where==='hand' && ref.arr){
        ref.arr[ref.idx]=null;
      } else {
        if(ref.owner==='white') playerReserve=null;
        else aiReserve=null;
      }
      // hard-clear so king cannot be saved again by the same card
      if(ref.owner==='black') aiReserve=null;
      if(ref.owner==='white') playerReserve=null;
    }
    /** Auto-save king with reserve «Будущее» for 8 pairs. Card is always spent. */
    function tryKingFutureSave(owner, kx, ky, kingPiece){
      const ref = findFutureCard(owner);
      if(!ref) return false;
      consumeFutureCard(ref);
      futureQueue.push({
        turnsLeft: 8*2,
        x: kx, y: ky,
        piece: kingPiece,
        owner: owner
      });
      log(owner==='white'
        ? 'Король спасён резервом «Будущее» на 8 пар — карта потрачена!'
        : 'Король ИИ спасён «Будущим» на 8 пар — резерв потрачен!');
      haptic('success');
      renderCards();
      return true;
    }

    function doMove(fx,fy,tx,ty,castle){
      let piece=board[fy][fx];
      let captured=board[ty][tx];
      if(castle){
        if(castle==='K'){ board[fy][5]=board[fy][7]; board[fy][7]=null; }
        else { board[fy][3]=board[fy][0]; board[fy][0]=null; }
      }
      if(piece && pieceChar(piece).toUpperCase()==='K'){ if(isWhite(piece)) whiteKingMoved=true; else blackKingMoved=true; }
      if(piece && pieceChar(piece).toUpperCase()==='R'){
        if(isWhite(piece)){ if(fx===0) whiteRookA=true; if(fx===7) whiteRookH=true; }
        else { if(fx===0) blackRookA=true; if(fx===7) blackRookH=true; }
      }

      // Shield on target: bounce attacker back, drop shield (other states stay)
      if(captured && (captured.shield || (typeof captured==='object' && captured.shield))){
        if(pieceOwner(captured)!==pieceOwner(piece)){
          log('Щит отразил удар!');
          haptic('medium');
          board[ty][tx]=withFlags(captured, {shield:false});
          board[fy][fx]=piece;
          selected=null; possibleMoves=[];
          afterMove();
          return;
        }
      }

      // Angel glow protection for defender's side: 78% reflect like shield
      if(captured && pieceOwner(captured)!==pieceOwner(piece)){
        const defOwner=pieceOwner(captured);
        if(inAngelGlow(tx,ty, defOwner) && Math.random()<0.78){
          log('Свет Ангела отразил атаку!');
          haptic('medium');
          board[fy][fx]=piece; // stay
          selected=null; possibleMoves=[];
          afterMove();
          return;
        }
      }

      if(captured&&pieceOwner(captured)===pieceOwner(piece)){
        board[ty][tx]=mergePieces(piece, captured);
        log('Слияние!'); haptic('success'); showTip('merge');
      } else {
        if(captured&&pieceChar(captured).toUpperCase()==='K'){
          const defOwner=pieceOwner(captured);
          if(tryKingFutureSave(defOwner, tx, ty, captured)){
            piece = maybePromote(piece, tx, ty);
            board[ty][tx]=piece;
            board[fy][fx]=null;
            selected=null; possibleMoves=[];
            rebuildAngelZones();
            afterMove();
            return;
          }
          board[fy][fx]=null;
          endGame(pieceOwner(piece), 'Король взят на клетке '+(String.fromCharCode(97+tx))+(boardH-ty)+'.', [{x:tx,y:ty,cls:'result-hot'}]);
          return;
        }
        piece = maybePromote(piece, tx, ty);
        board[ty][tx]=piece;
      }
      // promote after friendly merge too (pawn-base merges)
      if(board[ty][tx]) board[ty][tx]=maybePromote(board[ty][tx], tx, ty);
      board[fy][fx]=null; selected=null; possibleMoves=[];
      rebuildAngelZones();
      afterMove();
    }


    function processFuture(){
      const next=[];
      futureQueue.forEach(f=>{
        f.turnsLeft--;
        if(f.turnsLeft>0){ next.push(f); return; }
        if(!inBounds(f.x,f.y)){ frozen.push({x:f.x,y:f.y,piece:f.piece,owner:f.owner}); return; }
        const existing=board[f.y][f.x];
        if(!existing){
          board[f.y][f.x]=maybePromote(f.piece, f.x, f.y);
          log('Вернулась из будущего');
        } else if(pieceOwner(existing)!==f.owner){
          board[f.y][f.x]=f.piece;
          log('Вернулась и съела');
          if(pieceChar(existing).toUpperCase()==='K'){
            const defOwner=pieceOwner(existing);
            if(tryKingFutureSave(defOwner, f.x, f.y, existing)){
              board[f.y][f.x]=f.piece;
            } else {
              endGame(f.owner, 'Король съеден фигурой из будущего.', [{x:f.x,y:f.y,cls:'result-hot'}]);
            }
          }
          if(board[f.y][f.x]) board[f.y][f.x]=maybePromote(board[f.y][f.x], f.x, f.y);
        } else {
          // ally merge: stack movement + buffs
          board[f.y][f.x]=mergePieces(f.piece, existing);
          board[f.y][f.x]=maybePromote(board[f.y][f.x], f.x, f.y);
          log('Слияние при возврате');
        }
        haptic('medium');
      });
      futureQueue=next;
    }

    function checkEnd(){
      const wk=findKing('white'), bk=findKing('black');
      if(!wk){
        endGame('black', 'Белый король уничтожен или исчез с доски.', []);
        return true;
      }
      if(!bk){
        endGame('white', 'Чёрный король уничтожен или исчез с доски.', []);
        return true;
      }
      if(!hasAnyLegalMove(turn)){
        const k = turn==='white' ? wk : bk;
        // King away (future/frozen) or pieces blocked — do NOT softlock: skip turn
        if(k && (k.frozen || k.future)){
          return false; // caller / skip handles pass
        }
        // true stalemate/mate with king on board
        const loser=turn;
        const winner=loser==='white'?'black':'white';
        const reason = inCheck(loser)
          ? (loser==='white' ? 'Мат белым: королю некуда уйти.' : 'Мат чёрным: королю некуда уйти.')
          : (loser==='white' ? 'Белым нечем ходить (пат/нет ходов).' : 'Чёрным нечем ходить (пат/нет ходов).');
        const hl = (k && !k.frozen && !k.future) ? [{x:k.x,y:k.y,cls:'result-hot'}] : [];
        endGame(winner, reason, hl);
        return true;
      }
      return false;
    }

    function canSkipWhite(){
      // Always allow skip on your turn (except game over)
      return !gameOver && turn==='white';
    }
    /** @param alreadyAdvanced if true — processFuture/turnCount уже сделаны в afterMove */
    function passTurn(reason, alreadyAdvanced){
      if(gameOver) return;
      window._cardBusy=false; moving=false;
      log(reason||'Ход пропущен');
      selected=null; possibleMoves=[]; selectedSlot=null;
      // cancel pending card UI
      try { document.getElementById('future-picker').classList.remove('show'); } catch(e){}
      pendingFuture=null;
      if(!alreadyAdvanced){
        processFuture();
        turnCount++;
        maybeRandomResize();
        if(checkEnd()) return;
        if(turnCount>0 && turnCount%3===0){
          const id=pickRandomCardId();
          // карта стороне, которая будет ходить следующей
          if(turn==='white') giveItem(id, true);
          else giveItem(id, false);
        }
      }
      turn = turn==='white' ? 'black' : 'white';
      rebuildAngelZones();
      window._cardBusy=false; moving=false;
      render();
      if(gameOver) return;
      if(!hasAnyLegalMove(turn)){
        const k=findKing(turn);
        if(k && (k.frozen || k.future)){
          setTimeout(()=>passTurn(turn==='white'?'Белый король вне поля — пропуск':'Король ИИ вне поля — пропуск', false), 500);
          return;
        }
        if(checkEnd()) return;
      }
      if(turn==='black' && !gameOver){
        setTimeout(()=>{ try{ aiTurn(); }catch(e){ turn='white'; moving=false; window._cardBusy=false; render(); } }, 400);
      } else {
        updateSkipBtn();
      }
    }
    function updateSkipBtn(){
      const btn=document.getElementById('skip-btn');
      if(!btn) return;
      const can = canSkipWhite();
      btn.disabled = !can;
      btn.style.pointerEvents = can ? 'auto' : 'none';
      btn.style.opacity = can ? '1' : '0.35';
      btn.textContent = 'Пропуск хода';
    }

    function endGame(winner, reason, highlights){
      gameOver=true;
      lastEndWinner=winner;
      lastEndReason=reason||'';
      lastEndHighlight=highlights||[];
      // also highlight remaining kings
      const wk=findKing('white'), bk=findKing('black');
      if(wk && !wk.frozen && !wk.future && !lastEndHighlight.some(h=>h.x===wk.x&&h.y===wk.y))
        lastEndHighlight.push({x:wk.x,y:wk.y,cls: winner==='white'?'result-ok':'result-hot'});
      if(bk && !bk.frozen && !bk.future && !lastEndHighlight.some(h=>h.x===bk.x&&h.y===bk.y))
        lastEndHighlight.push({x:bk.x,y:bk.y,cls: winner==='black'?'result-ok':'result-hot'});

      document.getElementById('go-text').textContent=winner==='white'?'Победа!':'Поражение...';
      const gr=document.getElementById('go-reason');
      if(gr) gr.textContent=lastEndReason;
      document.getElementById('game-over').classList.add('show');
      log(winner==='white'?'Победа!':'Поражение...');
      haptic(winner==='white'?'success':'error'); render();
    }
    function showResultOnBoard(){
      document.getElementById('game-over').classList.remove('show');
      const rb=document.getElementById('result-banner'); if(rb) rb.classList.remove('show');
      lastEndReason=''; lastEndHighlight=[];
      const ban=document.getElementById('result-banner');
      if(ban){
        ban.innerHTML = (lastEndWinner==='white'?'<b>Победа</b>':'<b>Поражение</b>') + '<br>' + (lastEndReason||'');
        ban.classList.add('show');
      }
      // re-render with highlights
      render();
      lastEndHighlight.forEach(h=>{
        const boardEl=document.getElementById('board');
        if(!boardEl) return;
        const cell=boardEl.children[h.y*boardW+h.x];
        if(cell) cell.classList.add(h.cls||'result-hot');
      });
    }
    document.getElementById('btn-show-result').onclick = showResultOnBoard;


    function afterMove(){
      processFuture(); turnCount++;
      if(turnCount===1){ showTip('first_move'); setTimeout(()=>showTip('camera'), 600); }
      maybeRandomResize();
      if(checkEnd()) return;

      // every 3 half-moves give a random card to current player about to play? after move -> give to next
      if(turnCount>0 && turnCount%3===0){
        const id=pickRandomCardId();
        if(turn==='white') giveItem(id, false);
        else giveItem(id, true);
      }

      if(extraMove && turn==='white'){
        extraMove=false;
        log('Доп. ход!');
        turn='white';
        selected=null; possibleMoves=[];
        rebuildAngelZones();
        render();
        return;
      }

      turn=turn==='white'?'black':'white';
      selected=null; possibleMoves=[];
      rebuildAngelZones();
      window._cardBusy=false; moving=false;
      render();
      if(gameOver) return;
      if(!hasAnyLegalMove(turn)){
        const k=findKing(turn);
        if(k && (k.frozen || k.future)){
          // alreadyAdvanced: processFuture/turnCount уже в afterMove
          setTimeout(()=>passTurn(turn==='white'?'Белый король вне поля — пропуск':'Король ИИ вне поля — пропуск', true), 500);
          return;
        }
        if(checkEnd()) return;
      }
      if(turn==='black'){
        setTimeout(()=>{ try{ aiTurn(); }catch(e){ console.error(e); turn='white'; moving=false; window._cardBusy=false; render(); } }, 420);
      } else {
        updateSkipBtn();
      }
    }


    document.getElementById('dbg-btn').onclick = () => {
      document.getElementById('dbg-panel').classList.toggle('show');
    };
    (function bindSkipBtn(){
      const btn=document.getElementById('skip-btn');
      if(!btn) return;
      const doSkip=(e)=>{
        if(e){ e.preventDefault(); e.stopPropagation(); }
        // force-unlock stuck animation flags so skip always works on your turn
        window._cardBusy=false;
        moving=false;
        if(gameOver){ log('Игра уже окончена'); return; }
        if(turn!=='white'){ log('Сейчас ход противника'); return; }
        selected=null; possibleMoves=[]; selectedSlot=null;
        passTurn('Ход пропущен');
      };
      btn.onclick = doSkip;
      btn.addEventListener('pointerup', (e)=>{
        // mobile: prefer pointerup so tap isn't swallowed
        if(e.pointerType==='touch' || e.pointerType==='pen') doSkip(e);
      });
    })();
    // failsafe: unstick UI locks and refresh skip button
    setInterval(()=>{
      const fly=document.getElementById('fly-card');
      const flyHidden = !fly || fly.style.display==='none' || fly.style.display==='';
      if(window._cardBusy && flyHidden){
        window._cardBusy=false;
        moving=false;
      }
      updateSkipBtn();
    }, 800);
    function runDebug(code){
      const parts=code.trim().split(/\s+/); if(!parts[0]) return;
      // allow "TUT D1" together
      if(parts.length>=2 && parts[0].toUpperCase()==='TUT' && parts[1].toUpperCase()==='D1'){
        try{ localStorage.removeItem('chaos_chess_tut_off'); Object.keys(EVENT_TIPS).forEach(k=>localStorage.removeItem('chaos_tip_'+k)); }catch(e){}
        showTip('input_line', true);
        setupStartPosition();
        log('TUT + D1');
        return;
      }
      const cmd=parts[0].toUpperCase();
      if(cmd==='D1'){ setupStartPosition(); return; }
      if(cmd==='TUT'){
        try{ localStorage.removeItem('chaos_chess_tut_off'); Object.keys(EVENT_TIPS).forEach(k=>localStorage.removeItem('chaos_tip_'+k)); }catch(e){}
        log('Обучение');
        showTip('input_line', true);
        return;
      }
      // hidden commands (not listed in UI)
      if(cmd==='A1'){ giveItem(parts[1]||'future'); render(); return; }
      if(cmd==='A2'){ giveItem(parts[1]||'future',true); render(); return; }
      if(cmd==='RES'){
        const id=parts[1]||'future';
        const def=ITEM_DEFS[id]; if(!def) return;
        playerReserve={item:{...def,id}, readyAt: id==='future'?999999:turnCount+6, autoOnly:id==='future'};
        render(); return;
      }
    }
    document.getElementById('debug-btn').onclick=()=>{
      runDebug(document.getElementById('debug-input').value);
      document.getElementById('debug-input').value='';
      document.getElementById('dbg-panel').classList.remove('show');
    };

    function setupStartPosition(){
      document.getElementById('game-over').classList.remove('show');
      const rb=document.getElementById('result-banner'); if(rb) rb.classList.remove('show');
      lastEndReason=''; lastEndHighlight=[];
      document.getElementById('future-picker').classList.remove('show');
      gameOver=false; boardW=8; boardH=8; turnCount=0; moving=false;
      board=createEmpty(8,8);
      const back=['R','N','B','Q','K','B','N','R'];
      for(let x=0;x<8;x++){ board[0][x]=back[x]; board[1][x]='P'; board[6][x]='p'; board[7][x]=back[x].toLowerCase(); }
      frozen=[]; futureQueue=[]; turn='white';
      selected=null; possibleMoves=[]; selectedSlot=null; pendingFuture=null;
      slots=[null,null,null]; aiSlots=[null,null,null];
      playerReserve=null; aiReserve=null;
      whiteKingMoved=blackKingMoved=false;
      whiteRookA=whiteRookH=blackRookA=blackRookH=false;
      camScale=1; camX=0; camY=0; applyCam();
      giveItem('airstrike'); giveItem('shield'); giveItem('spawn');
      giveItem('support',true); giveItem('airstrike',true);
      // player starts without free future in hand; can put future in reserve later
      // AI: 70% future already in reserve (auto king-save)
      if(Math.random() < 0.70){
        aiReserve = { item: {...ITEM_DEFS.future, id:'future'}, readyAt: 999999, autoOnly: true };
      }
      // player can receive future in normal rotation
      gameLog=[]; log('Игра началась');
      window._cardBusy=false;
      render();
      requestAnimationFrame(()=>{ render(); updateSkipBtn(); });
    }

    setupStartPosition();
  </script>
</body>
</html>
