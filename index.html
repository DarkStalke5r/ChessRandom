/* ---------- проверка связи (ping/pong) ---------- */
function stopNetHeartbeat(){ clearInterval(netPingT); netPingT = null; }
function startNetHeartbeat(){ stopNetHeartbeat(); netPingT = setInterval(netBeat, NET_PING_MS); }
function netBeat(){
  const now = Date.now();
  if(onlineRole === 'host' && netRoom){
    netBroadcast({ t:'ping' });
    Object.values(netRoom.players).forEach(p=>{
      if(p.id !== 'host' && p.connected !== false && p.peer && now-(p.lastSeen||0) > NET_DEAD_MS){
        const c = netConns[p.peer]; if(c){ try{ c.close(); }catch(e){} hostDropConn(c); }
      }
    });
  } else if(onlineRole === 'guest' && netHostConn && !netReconT){
    if(now - netLastRx > NET_DEAD_MS) guestLost();
  }
}
document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState !== 'visible' || !onlineMode) return;
  if(onlineRole === 'guest' && !netReconT){
    if(!netHostConn || !netHostConn.open) guestLost(); else netSend(netHostConn, { t:'pong' });
  }
});
window.addEventListener('online', ()=>{ if(onlineMode && onlineRole === 'guest' && !netReconT && (!netHostConn || !netHostConn.open)) guestLost(); });

function netTeardownConn(){
  netSess++;
  try{ if(netHostConn) netHostConn.close(); }catch(e){}
  netHostConn = null;
  try{ if(netPeer) netPeer.destroy(); }catch(e){}
  netPeer = null;
}
function netCleanup(){
  clearTimeout(netAiTimer); clearTimeout(netReconT); netReconT = null; clearTimeout(netSaveT);
  stopNetHeartbeat();
  try{ Object.values(netConns).forEach(c=>{ try{ c.close(); }catch(e){} }); }catch(e){}
  netConns = {}; connTok = {};
  if(netRoom && netRoom.players) Object.values(netRoom.players).forEach(p=>clearTimeout(p.graceT));
  netTeardownConn();
  netRoom = null; netLobbyCb = null; netPending = null; netGameOn = false;
  remoteQ = []; remoteRunning = false;
  netSetBlock(null);
}

/* ---------- хост ---------- */
function hostPublishLobby(){
  if(!netRoom) return;
  netBroadcast({ t:'lobby', room:netRoom });
  if(netLobbyCb) netLobbyCb(netRoom);
}
function hostBindPeer(peer, sess){
  peer.on('connection', conn=>{
    conn.on('data', msg=>{ if(sess === netSess) hostOnData(conn, msg); });
    conn.on('close', ()=>{ if(sess === netSess) hostDropConn(conn); });
    conn.on('error', ()=>{ if(sess === netSess) hostDropConn(conn); });
  });
  const rec = ()=>{
    if(sess !== netSess) return;
    try{ if(peer.disconnected) peer.reconnect(); }catch(e){}
    setTimeout(()=>{ if(sess === netSess && peer.disconnected) rec(); }, 3000);
  };
  peer.on('disconnected', rec);
  peer.on('error', e=>console.warn('peer', e));
}
function hostOnData(conn, msg){
  if(!msg || typeof msg !== 'object' || !netRoom) return;
  const tok = connTok[conn.peer];
  if(tok && netRoom.players[tok]) netRoom.players[tok].lastSeen = Date.now();
  if(msg.t === 'hello'){ hostHello(conn, msg); return; }
  if(!tok) return;
  if(msg.t === 'state' && msg.snap){
    netBroadcast(msg, conn.peer);
    netGotState(msg);
    hostSaveState();
  } else if(msg.t === 'anim'){
    netBroadcast(msg, conn.peer);
    netGotAnim(msg);
  }
}
function hostHello(conn, msg){
  const tok = String(msg.token || conn.peer).slice(0, 64);
  let p = netRoom.players[tok];
  const reject = r=>{ netSend(conn, {t:'reject', reason:r}); setTimeout(()=>{ try{ conn.close(); }catch(e){} }, 400); };
  if(netRoom.status === 'playing'){
    if(!p || !p.seat) return reject('Игра уже идёт');
  } else if(!p){
    const n = Object.keys(netRoom.players).length;
    if(n >= netRoom.maxPlayers) return reject('Комната полная');
    p = netRoom.players[tok] = { id:tok, name:'Игрок '+(n+1), seat:null, joinedAt:Date.now() };
  }
  if(p.peer && p.peer !== conn.peer && netConns[p.peer]){   // заменяем старое подключение этого игрока
    const old = netConns[p.peer]; delete netConns[p.peer]; delete connTok[p.peer]; try{ old.close(); }catch(e){}
  }
  netConns[conn.peer] = conn; connTok[conn.peer] = tok;
  p.peer = conn.peer; p.lastSeen = Date.now();
  const wasLost = p.connected === false; p.connected = true;
  netSend(conn, { t:'welcome', id:conn.peer, token:tok, code:netRoom.code });
  if(netRoom.status === 'playing') hostPlayerBack(p, conn, wasLost);
  else hostPublishLobby();
}
function hostDropConn(conn){
  const peerId = conn.peer, tok = connTok[peerId];
  delete netConns[peerId]; delete connTok[peerId];
  if(!netRoom || !tok) return;
  const p = netRoom.players[tok];
  if(!p || p.peer !== peerId) return;        // игрок уже подключился заново
  if(netRoom.status === 'lobby'){ delete netRoom.players[tok]; hostPublishLobby(); return; }
  if(p.connected === false || over) return;
  hostMarkLost(p);
}
function hostMarkLost(p){
  p.connected = false; p.lostAt = Date.now();
  if(!p.seat) return;
  const humans = Object.values(netRoom.players).filter(q=>q.seat).length;
  if(humans > 2){
    delete onlineHumanSeats[p.seat];
    netBroadcast({ t:'seats', seats:onlineHumanSeats });
    try{ log('«'+(NAME[p.seat]||p.seat)+'»: нет связи — пока играет бот'); }catch(e){}
    onlineMaybeAI();
  } else {
    netRoom.paused = p.id;
    const txt = 'У игрока ('+(NAME[p.seat]||p.seat)+') проблемы с подключением. Он сейчас присоединится…';
    netBroadcast({ t:'pause', on:true, text:txt });
    netSetBlock(txt);
    clearTimeout(p.graceT);
    p.graceT = setTimeout(()=>{
      if(!netRoom || p.connected !== false || netRoom.paused !== p.id) return;
      netRoom.paused = null;
      delete onlineHumanSeats[p.seat];
      netBroadcast({ t:'seats', seats:onlineHumanSeats });
      netBroadcast({ t:'pause', on:false });
      netSetBlock(null);
      try{ log('«'+(NAME[p.seat]||p.seat)+'» не вернулся — играет бот (можно вернуться по коду)'); }catch(e){}
      onlineMaybeAI();
    }, NET_GRACE2_MS);
  }
  hostSaveState();
}
function hostPlayerBack(p, conn, wasLost){
  clearTimeout(p.graceT);
  onlineHumanSeats[p.seat] = true;
  netBroadcast({ t:'seats', seats:onlineHumanSeats }, conn.peer);
  let fromPause = false;
  if(netRoom.paused === p.id){
    netRoom.paused = null; fromPause = true;
    netBroadcast({ t:'pause', on:false }, conn.peer);
    netSetBlock(null);
  }
  if(wasLost){ try{ log('«'+(NAME[p.seat]||p.seat)+'» снова в игре'); }catch(e){} }
  netSend(conn, { t:'resume', seat:p.seat, seats:onlineHumanSeats, cfg:netRoom.cfg, snap:JSON.parse(JSON.stringify(onlineSnapshot())) });
  if(fromPause) onlineMaybeAI();
}
async function onlineCreateRoom(maxPlayers){
  await loadPeerSDK();
  netCleanup();
  const sess = netSess;
  let code, peer = null, tries = 0;
  while(!peer){
    code = genRoomCode();
    try{ peer = await openPeer(PEER_PREFIX+code); }
    catch(e){
      if(e && e.type === 'unavailable-id' && ++tries < 6) continue;
      throw netErr(e);
    }
  }
  if(sess !== netSess){ try{ peer.destroy(); }catch(e){} throw new Error('Отменено'); }
  netPeer = peer;
  onlinePlayerId = peer.id; onlineToken = 'host';
  onlineRole = 'host'; onlineRoomCode = code; onlineSeat = 'white'; onlineHumanSeats = {white:true};
  netRoom = {
    code, hostId:onlinePlayerId,
    maxPlayers: Math.min(4, Math.max(2, maxPlayers||2)),
    status:'lobby', cfg:null, createdAt:Date.now(), paused:null,
    players:{ host:{ id:'host', name:'Хост', seat:'white', peer:peer.id, connected:true, joinedAt:Date.now() } }
  };
  hostBindPeer(peer, sess);
  startNetHeartbeat();
  return code;
}
async function onlineStartGame(cfg){
  if(onlineRole !== 'host' || !netRoom) return;
  const nt = [2,3,4].includes(cfg.teams) ? cfg.teams : 4;
  const order = seatOrderFor(nt);
  const guests = Object.keys(netRoom.players).filter(id=>id !== 'host');
  if(guests.length + 1 > order.length){
    throw new Error('Игроков ('+(guests.length+1)+') больше, чем команд ('+order.length+'). Выбери больше команд при настройке.');
  }
  const seats = { host:order[0] };
  guests.forEach((id,i)=>{ seats[id] = order[i+1]; });
  Object.keys(seats).forEach(id=>{ netRoom.players[id].seat = seats[id]; });
  onlineSeat = order[0];
  onlineHumanSeats = {};
  Object.values(seats).forEach(s=>{ onlineHumanSeats[s] = true; });
  netRoom.status = 'playing'; netRoom.cfg = cfg;
  netBroadcast({ t:'start', cfg, seats });
  netSaveSession({ role:'host', code:netRoom.code, token:'host' });
}
// возвращение хоста после перезагрузки страницы: комната и партия восстанавливаются из сохранённого состояния
async function onlineResumeHost(s){
  await loadPeerSDK();
  let hs = null;
  try{ hs = JSON.parse(localStorage.getItem(NET_HOST_KEY)); }catch(e){}
  if(!hs || hs.code !== s.code || !hs.snap || !hs.room) throw new Error('Сохранённая партия не найдена');
  netCleanup();
  const sess = netSess, t0 = Date.now();
  let peer = null;
  while(!peer){   // старая регистрация на брокере может держаться до минуты
    try{ peer = await openPeer(PEER_PREFIX+hs.code); }
    catch(e){
      if(e && e.type === 'unavailable-id' && Date.now()-t0 < 60000){ await netSleep(2500); continue; }
      throw netErr(e);
    }
  }
  if(sess !== netSess){ try{ peer.destroy(); }catch(e){} throw new Error('Отменено'); }
  netPeer = peer; onlineMode = true; onlineRole = 'host'; onlineRoomCode = hs.code; onlineToken = 'host'; onlinePlayerId = peer.id;
  netRoom = hs.room; netRoom.paused = null; netRoom.status = 'playing';
  Object.values(netRoom.players).forEach(p=>{ p.lastSeen = Date.now(); p.connected = p.id === 'host'; p.peer = p.id === 'host' ? peer.id : null; });
  onlineSeat = netRoom.players.host.seat || 'white';
  onlineHumanSeats = hs.humanSeats || {white:true};
  hostBindPeer(peer, sess);
  startNetHeartbeat();
  if(netRoom.cfg) CFG = Object.assign(CFG, netRoom.cfg);
  start();
  onlineApplySnapshotNow(hs.snap);
  Object.values(netRoom.players).filter(p=>p.id !== 'host' && p.seat).forEach(p=>{ hostMarkLost(p); });
  netSaveSession({ role:'host', code:hs.code, token:'host' });
  try{ log('Партия восстановлена. Ждём возвращения игроков…'); }catch(e){}
}

/* ---------- гость ---------- */
function guestOnData(msg){
  if(!msg || typeof msg !== 'object') return;
  if(msg.t === 'lobby'){
    netRoom = msg.room;
    if(netLobbyCb) netLobbyCb(netRoom);
  } else if(msg.t === 'start'){
    onlineSeat = msg.seats[onlineToken] || null;
    onlineHumanSeats = {};
    Object.values(msg.seats).forEach(s=>{ onlineHumanSeats[s] = true; });
    if(!netRoom) netRoom = { players:{} };
    netRoom.status = 'playing'; netRoom.cfg = msg.cfg;
    netSaveSession({ role:'guest', code:onlineRoomCode, token:onlineToken });
    if(netLobbyCb) netLobbyCb(netRoom);
  } else if(msg.t === 'resume'){
    onlineSeat = msg.seat; onlineHumanSeats = msg.seats || {};
    if(msg.cfg) CFG = Object.assign(CFG, msg.cfg);
    if(!netRoom) netRoom = { players:{} };
    netRoom.status = 'playing';
    netSetBlock(null);
    const ov = document.getElementById('plus-setup'); if(ov) ov.remove();
    if(!netGameOn) start();           // страница была перезагружена — поднимаем партию заново
    if(msg.snap) onlineApplySnapshot(msg.snap);
    netSaveSession({ role:'guest', code:onlineRoomCode, token:onlineToken });
    try{ log('Вы снова в игре'); }catch(e){}
  } else if(msg.t === 'seats'){
    onlineHumanSeats = msg.seats || {};
  } else if(msg.t === 'pause'){
    netSetBlock(msg.on ? (msg.text || 'У игрока проблемы с подключением. Он сейчас присоединится…') : null);
  } else if(msg.t === 'ping'){
    netSend(netHostConn, { t:'pong' });
  } else if(msg.t === 'state'){
    netGotState(msg);
  } else if(msg.t === 'anim'){
    netGotAnim(msg);
  }
}
async function guestConnect(code, token, wantResume){
  netTeardownConn();
  const sess = netSess;
  let peer;
  try{ peer = await openPeer(null); } catch(e){ throw netErr(e); }
  if(sess !== netSess){ try{ peer.destroy(); }catch(e){} throw new Error('Отменено'); }
  netPeer = peer; onlinePlayerId = peer.id;
  const conn = peer.connect(PEER_PREFIX+code, { reliable:true });
  netHostConn = conn;
  await new Promise((resolve, reject)=>{
    let done = false, to = null;
    const fail = e=>{ if(done) return; done = true; clearTimeout(to); reject(e instanceof Error ? e : netErr(e)); };
    to = setTimeout(()=>fail(new Error('Комната не отвечает (проверь код)')), 15000);
    peer.on('error', e=>{ if(!done) fail(netErr(e)); else console.warn('peer', e); });
    peer.on('disconnected', ()=>{ try{ if(sess === netSess) peer.reconnect(); }catch(e){} });
    conn.on('error', fail);
    conn.on('open', ()=>{ conn.send({ t:'hello', token, resume:!!wantResume }); });
    conn.on('data', msg=>{
      if(sess !== netSess || !msg) return;
      netLastRx = Date.now();
      if(msg.t === 'welcome' && !done){ done = true; clearTimeout(to); resolve(); return; }
      if(msg.t === 'reject'){ if(!done) fail(new Error(msg.reason || 'Отказано')); return; }
      guestOnData(msg);
    });
    conn.on('close', ()=>{ if(!done) fail(new Error('Соединение закрыто')); else if(sess === netSess) guestLost(); });
  });
  netLastRx = Date.now();
  startNetHeartbeat();
}
async function onlineJoinRoom(code){
  code = String(code||'').trim().toUpperCase();
  if(code.length < 4) throw new Error('Короткий код');
  await loadPeerSDK();
  netCleanup();
  onlineToken = genToken(); onlineRole = 'guest'; onlineRoomCode = code; onlineSeat = null; onlineHumanSeats = {};
  netRoom = { players:{}, status:'lobby' };
  await guestConnect(code, onlineToken, false);
  netSaveSession({ role:'guest', code, token:onlineToken });
  return { code };
}
async function onlineResumeGuest(s){
  await loadPeerSDK();
  netCleanup();
  onlineMode = true; onlineRole = 'guest'; onlineRoomCode = s.code; onlineToken = s.token; onlineSeat = null; onlineHumanSeats = {};
  netRoom = { players:{}, status:'lobby' };
  await guestConnect(s.code, s.token, true);
}
// потеря связи у гостя: сами пытаемся вернуться по тому же коду
function guestLost(){
  if(onlineRole !== 'guest' || !onlineMode || netReconT) return;
  netSetBlock('Нет связи с хостом. Переподключаюсь…');
  netReconTry = 0;
  guestReconnectLoop();
}
function guestReconnectLoop(){
  const code = onlineRoomCode, tok = onlineToken;
  netReconT = setTimeout(async ()=>{
    netReconT = null;
    if(!onlineMode || onlineRole !== 'guest' || onlineRoomCode !== code) return;
    netReconTry++;
    try{
      await guestConnect(code, tok, true);
      if(!onlineMode || onlineRoomCode !== code) return;
      netReconTry = 0;
      if(!netGameOn) netSetBlock(null);   // если партия идёт — баннер уберёт сообщение «resume»
    }catch(e){
      if(!onlineMode || onlineRoomCode !== code) return;
      if(netReconTry >= 40){ netSetBlock('Не удалось вернуться: '+e.message+'. Нажми на Тето → «Оффлайн», чтобы выйти.'); return; }
      netSetBlock('Нет связи. Переподключаюсь… (попытка '+netReconTry+')');
      guestReconnectLoop();
    }
  }, netReconTry === 0 ? 300 : Math.min(1000*(netReconTry+1), 4000));
}

/* ---------- окно «Вернуться в партию?» после перезагрузки ---------- */
function showResumeDialog(s, had){
  const ov = document.createElement('div');
  ov.id = 'resume-dialog';
  ov.style.cssText = 'position:fixed;inset:0;z-index:180;background:rgba(0,0,0,.72);display:flex;align-items:center;justify-content:center;padding:16px';
  const box = document.createElement('div');
  box.style.cssText = 'background:#fff7e0;color:#222;border-radius:16px;padding:16px 18px;max-width:340px;width:100%;font-size:14px;line-height:1.4;box-shadow:0 10px 40px rgba(0,0,0,.5)';
  const txt = document.createElement('div'), btns = document.createElement('div');
  btns.style.cssText = 'display:flex;gap:8px;flex-wrap:wrap;margin-top:12px';
  box.appendChild(txt); box.appendChild(btns); ov.appendChild(box); document.body.appendChild(ov);
  const mk = (label, fn, primary)=>{
    const b = document.createElement('button'); b.textContent = label;
    b.style.cssText = 'padding:9px 14px;border-radius:10px;border:1px solid #b9b2a0;font-weight:700;cursor:pointer;background:'+(primary?'#2aabee;color:#fff':'#ffd98a');
    b.onclick = fn; btns.appendChild(b);
  };
  const leave = ()=>{ netClearSession(); onlineDisconnect(); ov.remove(); if(!had) openSetup(true); };
  const ask = ()=>{
    txt.textContent = 'Найдена онлайн-партия: комната '+s.code+' ('+(s.role==='host'?'вы хост':'вы гость')+'). Вернуться?';
    btns.innerHTML = ''; mk('Вернуться', go, true); mk('Нет, начать заново', leave);
  };
  const go = async ()=>{
    txt.textContent = 'Подключаюсь к комнате '+s.code+'…'; btns.innerHTML = '';
    try{
      if(s.role === 'host'){ await onlineResumeHost(s); ov.remove(); return; }
      await onlineResumeGuest(s);
      for(let i=0;i<20 && !netGameOn;i++) await netSleep(150);
      if(netGameOn){ ov.remove(); return; }
      txt.textContent = 'Подключено к комнате '+s.code+'. Игра ещё не началась — ждём хоста…';
      onlineListenLobby(room=>{
        if(room.status === 'playing'){ if(room.cfg) CFG = Object.assign(CFG, room.cfg); ov.remove(); start(); }
      });
    }catch(e){
      txt.textContent = 'Не удалось вернуться: '+e.message;
      btns.innerHTML = ''; mk('Ещё раз', go, true); mk('Выйти', leave);
    }
  };
  ask();
}

/* ---------- общее: лобби, состояние игры, ИИ ---------- */
function onlineListenLobby(onUpdate){
  netLobbyCb = onUpdate;
  if(netRoom) onUpdate(netRoom);
}
function onlineSnapshot(){
  // Полный снимок Plus-партии для синхронизации
  return {
    seq: ++onlineStateSeq,
    B: B,
    G: G,
    ti: ti,
    round: round,
    extra: !!extra,
    skipT: skipT||null,
    CS: CS,
    R: R,
    fut: fut,
    SL: SL,
    over: !!over,
    ritual: ritual,
    bossSt: bossSt,
    pile: pile,
    craftRound: craftRound,
    nukeDone: !!nukeDone,
    grave: grave,
    ORDER: ORDER,
    CFG: CFG,
    __plusMines: window.__plusMines||[],
    JEST: JEST,
    GUNS: GUNS,
    FALLEN: FALLEN
  };
}
function onlineApplySnapshotNow(st){
  if(!st || !st.B) return;
  onlineApplying = true;
  try {
    B = st.B;
    if(st.G) G = st.G;
    if(typeof st.ti==='number') ti = st.ti;
    if(typeof st.round==='number') round = st.round;
    extra = !!st.extra;
    skipT = st.skipT||null;
    if(st.CS) CS = st.CS;
    if(st.R) R = st.R;
    if(st.fut) fut = st.fut;
    if(st.SL) SL = st.SL;
    over = !!st.over;
    ritual = st.ritual||null;
    bossSt = st.bossSt||null;
    pile = st.pile||[];
    craftRound = st.craftRound||0;
    nukeDone = !!st.nukeDone;
    grave = st.grave||[];
    if(st.ORDER) ORDER = st.ORDER;
    if(st.CFG) CFG = Object.assign(CFG, st.CFG);
    window.__plusMines = st.__plusMines||[];
    JEST = st.JEST||null; GUNS = st.GUNS||[]; FALLEN = st.FALLEN||[];
    if(typeof st.seq==='number') onlineStateSeq = Math.max(onlineStateSeq, st.seq);
    sel=null; moves=null; selSlot=null; chain=false; busy=false;
    if(over){
      document.getElementById('game-over').classList.add('show');
    }
    draw();
    updateOnlineBadge();
  } finally {
    onlineApplying = false;
  }
}


function netGotState(msg){
  if(!netGameOn){ netPending = msg; return; }
  if(msg.snap) onlineApplySnapshot(msg.snap);
}
/* ---------- очередь: анимации и снимки состояния играются строго по порядку ---------- */
let remoteQ=[],remoteRunning=false;
function onlineSendAnim(a){
  if(!onlineMode||!onlineRoomCode||!netPeer||!netGameOn)return;
  const m={t:'anim',a,by:onlinePlayerId};
  if(onlineRole==='host')netBroadcast(m);else netSend(netHostConn,m);
}
function netGotAnim(msg){
  if(!netGameOn||!msg||!msg.a)return;
  remoteQ.push({a:msg.a});remoteRun();
}
function onlineApplySnapshot(st){
  if(!st||!st.B)return;
  const last=remoteQ[remoteQ.length-1];
  if(last&&last.snap)last.snap=st;else remoteQ.push({snap:st});   // подряд идущие снимки — берём последний
  remoteRun();
}
function remoteRun(){
  if(remoteRunning)return;
  const it=remoteQ.shift();if(!it)return;
  if(it.snap){
    onlineApplySnapshotNow(it.snap);
    if(onlineRole==='host')onlineMaybeAI();
    return remoteRun();
  }
  const a=it.a;remoteRunning=true;
  let finished=false,wd=null;
  const fin=()=>{if(finished)return;finished=true;clearTimeout(wd);remoteRunning=false;remoteRun();};
  wd=setTimeout(fin,a.k==='nuke'?12000:6000);
  try{
    if(over){fin();return;}
    if(a.k==='move')animMove0(a.fx,a.fy,a.tx,a.ty,fin);
    else if(a.k==='card')cardAnim0(a.t,a.where,a.type,a.tx,a.ty,fin);
    else if(a.k==='nuke')remoteNuke(a,fin);
    else fin();
  }catch(e){console.warn('remote anim',e);fin();}
}
// ядерка у остальных: те же подсветка зоны, отсчёт и ракета (сами изменения придут снимками)
function remoteNuke(a,fin){
  const cx=a.cx,cy=a.cy;busy=true;
  for(let dy=-2;dy<=1;dy++)for(let dx=-1;dx<=1;dx++)if(valid(cx+dx,cy+dy))hl.push({x:cx+dx,y:cy+dy,cls:'nuke-blast',until:Date.now()+9500});
  log('Ядерка запущена… 8 секунд до удара');draw();
  let left=8;const tick=setInterval(()=>{left--;if(left>0)log('До удара: '+left+'…');},1000);
  setTimeout(()=>{clearInterval(tick);rocketAnim(cx,cy,()=>{busy=false;fin();});},8000);
}


async function onlinePushState(partial){
  if(!onlineMode || !onlineRoomCode || !netPeer || onlineApplying || !netGameOn) return;
  try{
    const payload = {
      t:'state', updatedAt:Date.now(), by:onlinePlayerId, seat:onlineSeat,
      snap: JSON.parse(JSON.stringify(onlineSnapshot()))
    };
    if(onlineRole === 'host'){ netBroadcast(payload); hostSaveState(); }
    else netSend(netHostConn, payload);
  }catch(e){ console.warn('online push', e); }
}
function onlineIsMyTurn(){
  if(!onlineMode) return ORDER[ti]==='white';
  return ORDER[ti]===onlineSeat;
}
function onlineSeatHasHuman(seat){
  return !!(onlineHumanSeats && onlineHumanSeats[seat]);
}
function updateOnlineBadge(){
  const el=document.getElementById('online-badge');
  if(!el) return;
  if(onlineMode && onlineRoomCode){
    el.classList.add('show');
    el.textContent = 'ONLINE '+onlineRoomCode+' · '+(NAME[onlineSeat]||onlineSeat)+(onlineIsMyTurn()?' · ваш ход':'')+(netBlock?' · ⚠ нет связи':'');
  } else el.classList.remove('show');
}


// ИИ за пустые места считает только хост, чтобы у всех было одно и то же
function onlineMaybeAI(tries){
  if(!onlineMode || onlineRole !== 'host' || over || netBlock) return;
  if(onlineSeatHasHuman(ORDER[ti])) return;
  clearTimeout(netAiTimer);
  netAiTimer = setTimeout(()=>{
    if(over || !onlineMode || netBlock || onlineSeatHasHuman(ORDER[ti])) return;
    if(busy){ if((tries||0) < 20) onlineMaybeAI((tries||0)+1); return; }
    ai();
  }, 600);
}
function onlineListenGame(){
  if(!onlineMode || !onlineRoomCode || !netPeer) return;
  netGameOn = true;
  if(netPending){
    const m = netPending; netPending = null;
    if(m.snap) onlineApplySnapshot(m.snap);
  }
  updateOnlineBadge();
}
function onlineDisconnect(){
  netCleanup();
  netClearSession();
  try{
    const badge = document.getElementById('online-badge');
    if(badge) badge.classList.remove('show');
  }catch(e){}
  onlineMode = false; onlineRole = null; onlineRoomCode = null; onlineSeat = null; onlineToken = null;
  onlineHumanSeats = {white:true};
}

// ===== Отладочные коды (ввод в панели кодов) =====
const TEAM_ALIAS={white:'white',w:'white','1':'white','бел':'white',black:'black',b:'black','2':'black','чёр':'black','чер':'black',pink:'pink',p:'pink','3':'pink','роз':'pink',blue:'blue',bl:'blue','4':'blue','син':'blue'};
function parseTeam(x,def){if(!x)return def;x=x.toLowerCase();if(TEAM_ALIAS[x])return TEAM_ALIAS[x];for(const k in TEAM_ALIAS)if(k.length>=3&&x.startsWith(k))return TEAM_ALIAS[k];return null;}
function dbgGive(t,id){if(CS[t].indexOf(null)<0)CS[t].push(null);giveCard(t,id);}
const oldDbg=runDebug;
runDebug=function(code){
  const parts=code.trim().split(/\s+/),c=(parts[0]||'').toUpperCase();
  const A={A1:'white',A2:'black',A3:'pink',A4:'blue'};
  if(A[c]){const id=PC[parts[1]]?parts[1]:pick(CPOOL);dbgGive(A[c],id);log('Код '+c+': '+NAME[A[c]]+' +'+PC[id].n);draw();return;}
  if(c==='RES'){const id=PC[parts[1]]?parts[1]:'shield',t=parseTeam(parts[2],'white');if(!t)return log('Неизвестная сторона');R[t]={type:id,ready:round};fresh[t]=[];log('Код RES: резерв '+NAME[t]+' = '+PC[id].n);draw();return;}
  if(c==='ALL'){
    const all=parts[1]&&parts[1].toLowerCase()==='all'?ORDER:[parseTeam(parts[1],'white')];
    if(!all[0])return log('Неизвестная сторона');
    all.forEach(t=>{CS[t]=Object.keys(PC);fresh[t]=Object.keys(PC).map(()=>1);});
    log('Код ALL: выданы все карточки ('+all.map(t=>NAME[t]).join(', ')+')');draw();return;
  }
  if(c==='KILL'){
    const t=parseTeam(parts[1]);if(!t)return log('KILL <white|black|pink|blue>');
    kill(t);selSlot=null;sel=null;moves=null;log('Код KILL: сторона «'+NAME[t]+'» уничтожена');
    if(!check())draw();return;
  }
  return oldDbg(code);
};
function check(){
  ORDER.forEach(t=>{if(!alive(t))kill(t);});
  if(bossSt&&!whiteCount())return end(false,'Босс съел все белые фигуры.');
  if(!alive('white'))return end(false,'Белые уничтожены.');
  if(ORDER.every(t=>t==='white'||!alive(t)))return end(true,'Все соперники уничтожены.');
  return false;
}
function end(win,why){
  over=true;
  document.getElementById('go-text').textContent=win?'Победа!':'Поражение...';
  const g=document.getElementById('go-reason');if(g)g.textContent=why;
  document.getElementById('game-over').classList.add('show');draw();try{netClearSession();}catch(e){}return true;
}
function newRound(){
  round++;
  each((q,x,y)=>{
    if(q.tmp&&q.tmp<=round){q.prot=false;delete q.tmp;}
    if(q.loan&&q.loan.until<=round){if(alive(q.loan.t))q.t=q.loan.t;else B[y][x]=null;delete q.loan;}
  });
  if(bossSt)bossTurn();
  neutralTurn();
  fut.forEach(f=>{f.left--;});
  fut=fut.filter(f=>{
    if(f.left>0)return true;
    if(!inW(f.x,f.y))return false;
    const ex=B[f.y][f.x];
    if(!ex){B[f.y][f.x]=f.piece;promoteIf(f.piece,f.x,f.y);log('Фигура ('+NAME[f.t]+') вернулась из будущего');return false;}
    if(ex.boss){log('Босс уничтожил фигуру, вернувшуюся из будущего');return false;}
    if(ex.t!==f.t){burry(ex,f.x,f.y);B[f.y][f.x]=f.piece;promoteIf(f.piece,f.x,f.y);log('Фигура ('+NAME[f.t]+') вернулась из будущего и съела');return false;}
    if(canMerge(f.piece,ex)){B[f.y][f.x]=mergeP(f.piece,ex);log('Слияние при возврате из будущего');return false;}
    f.left=1;return true;   // клетка занята своей — ждём ещё круг
  });
  ORDER.forEach(t=>{if(alive(t)&&Math.random()<0.45)giveCard(t);});
  if(round>1&&!bossSt&&Math.random()<0.2)mutate();
}
function advance(){
  if(check()){
    if(onlineMode) onlinePushState({full:true});
    return;
  }
  if(extra){
    extra=false;draw();
    if(onlineMode) onlinePushState({full:true});
    if(onlineMode){
      onlineMaybeAI();
    } else if(ORDER[ti]!=='white') setTimeout(ai,500);
    updateOnlineBadge();
    return;
  }
  tickStatus(ORDER[ti]);
  for(let i=0;i<ORDER.length;i++){
    ti=(ti+1)%ORDER.length;const t=ORDER[ti];
    if(!alive(t))continue;
    if(t==='white')newRound();
    if(skipT===t){skipT=null;log('Пропуск хода: '+NAME[t]);continue;}
    walk(t);if(check()){ if(onlineMode) onlinePushState({full:true}); return; }
    if(!teamMoves(t).length)continue;
    announceCheck(t);
    draw();
    if(onlineMode){
      onlinePushState({full:true});
      updateOnlineBadge();
      // ИИ только если за эту сторону никто не сидит онлайн
      onlineMaybeAI();
      return;
    }
    if(t!=='white')setTimeout(ai,500);return;
  }
  end(true,'Больше никто не может ходить.');
  if(onlineMode) onlinePushState({full:true});
}
function ai(){
  if(over||netBlock)return;const t=ORDER[ti];
  aiCard(t,()=>{
    if(over||check())return;
    const ms=teamMoves(t);if(!ms.length)return advance();
    const best=aiPickMove(t,ms);if(!best)return advance();
    doMove(best.fx,best.fy,best,()=>aiStep(best));
  });
}
function aiStep(m){
  if(over)return;
  if(m.jump){if(check())return;const c=B[m.y][m.x]?gen(m.x,m.y,true).filter(z=>z.jump):[];if(c.length)return doMove(m.x,m.y,c[0],()=>aiStep(c[0]));}
  {const hn=htNext(m);if(hn&&!check()){const ms2=hn.map(z=>({fx:m.x,fy:m.y,...z})),b2=aiPickMove(B[m.y][m.x].t,ms2);if(b2)return doMove(b2.fx,b2.fy,b2,()=>aiStep(b2));}}
  advance();
}
function click(x,y){
  if(window.inspectMode){
    try{
      const p=valid(x,y)&&B[y][x];
      if(!p){ if(typeof showInspectModal==='function') showInspectModal('Пустая клетка'); return; }
      const KN2={E:'Слонь',C:'Конница',H:'Хтонь',T:'Высокая Тура',Y:'Пони',G:'Цыганский конь',J:'Шут',P:'Пешка',N:'Конь',B:'Слон',R:'Ладья',Q:'Ферзь',K:'Король',m:'Шашка',d:'Дамка',X:'Фигура'};
      const lines=[
        (NAME[p.t]||p.t)+' · '+(KN2[p.k]||p.k||'?')+' '+(SYM2[p.k]||''),
        p.shield?'Щит: да':'Щит: нет',
        p.prot?'Защита: да':'',
        p.angel&&!p.demon?'Ангел: нимб, защищает клетки впереди (отражение 78%)':'',
        p.demon?'Демон: гасит ангелов в радиусе 2':'',
        (p.extra&&p.extra.length)?'Слияние: ещё ходит как '+p.extra.map(k=>KN2[k]||k).join(', '):'',
        p.frozen>0?'Лёд: заморожена, не ходит ещё '+p.frozen+' ход(а)':'',
        p.lying>0?'Лежит: сбита с ног, не ходит ещё '+p.lying+' ход':'',
        p.t==='neutral'?'Нейтральная фигура: ходит сама и бьёт всех':'',
        (p.home&&(p.k==='K'||p.k==='R'))?'Не ходила: возможна рокировка':'',
        p.boss?'БОСС':'',
        p.minion?'Миньон':'',
        p.k==='J'?'Шут: нейтрален, не атакует, его нельзя убить. Уводит королей за границу':'',
        p.gun?'Пистолет: '+(p.ammo||0)+' патр., стреляет без хода на 2 клетки':'',
        p.shot?'Ранена: лежит, раз в 2 круга может встать или исчезнуть':'',
        p.jail?'Увезена Шутом за границу':'',
        p.wall?'Стена: упавшая Высокая Тура, навсегда':'',
        (p.scared&&p.frozen>0)?'Испуг: не ходит ещё '+p.frozen+' ход(а)':'',
        KDESC[p.k]||''
      ].filter(Boolean);
      if(typeof showInspectModal==='function') showInspectModal(lines.join('\n'));
      else log(lines.join(' | '));
    }catch(e){ log('Осмотр: '+x+','+y); }
    return;
  }
  if(netBlock){log(netBlock);return;}
  if(onlineMode && !onlineIsMyTurn() && !(ritual&&ritual.wait)){
    log('Сейчас ход: '+(NAME[ORDER[ti]]||ORDER[ti])+' (вы: '+(NAME[onlineSeat]||onlineSeat)+')');
    return;
  }
  if(ritual){
    if(ritual.phase==='protect'&&ritual.wait){
      const mySeat = onlineMode ? onlineSeat : 'white';
      const q=valid(x,y)&&B[y][x];
      if(!q||q.t!==mySeat){log('Выбери свою фигуру');return;}
      if(q.prot)return;
      q.prot=true;ritual.n++;log('Вечная защита '+ritual.n+'/'+Math.min(3,ritual.avail));
      if(ritual.n>=Math.min(3,ritual.avail)){ritual.wait=false;finishProtect();}else draw();
      return;
    }
    if(!(ritual.phase==='fire'&&ritual.owner==='white'&&!busy&&selSlot!==null)){
      if(ritual.phase==='fire'&&ritual.owner==='white'&&!busy)log('Только ядерка: выбери карту «Ядерка»');
      return;
    }
  }
  const my = (onlineMode && onlineSeat) ? onlineSeat : 'white';
  if(busy||ORDER[ti]!==my)return;
  if(selSlot!==null){

function figLoad(k){
  if(!figReady)return {status:'loading'};
  if(figState[k])return figState[k];
  const st=figState[k]={status:'loading',img:null};
  const c=[];if(FIGURE_FILES[k])c.push(FIGURE_FILES[k]);
  (FIG_NAMES[k]||[k]).forEach(n=>['png','webp','svg'].forEach(e=>{c.push(FIG_DIR+n+'.'+e);c.push(n+'.'+e);}));

function figTinted(k,team){
  const own=figTeamFile(k,team);if(own)return own;
  const st=figLoad(k);if(st.status!=='ok')return null;
  const key=k+'|'+team;if(figTint[key])return figTint[key];
  try{
    const im=st.img,W0=im.naturalWidth||im.width||64,H0=im.naturalHeight||im.height||64,sc=Math.min(1,256/Math.max(W0,H0));
    const w=Math.max(1,Math.round(W0*sc)),h=Math.max(1,Math.round(H0*sc));
    const cv=document.createElement('canvas');cv.width=w;cv.height=h;
    const cx=cv.getContext('2d');cx.drawImage(im,0,0,w,h);
    const d=cx.getImageData(0,0,w,h),a=d.data,c=figRGB(team);
    for(let i=0;i<a.length;i+=4){a[i]=a[i]*c[0]/255;a[i+1]=a[i+1]*c[1]/255;a[i+2]=a[i+2]*c[2]/255;}
    cx.putImageData(d,0,0);
    return figTint[key]=cv.toDataURL('image/png');
  }catch(e){st.status='none';console.warn('figures: canvas недоступен (открой по http, не file://)',e);return null;}
}

function draw(){
  const el=document.getElementById('board');
  // === Мёбиус ∞: сплошная лента из кольцевых сегментов (как на референсе) ===
  if(G.shape==='m'){
    const W=G.x1-G.x0, H=G.y1-G.y0; // напр. 16×4
    const vp=document.getElementById('viewport');
    // строго в пределах видимой области viewport
    const maxW=Math.max(200, ((vp&&vp.clientWidth)||window.innerWidth||360) - 12);
    const maxH=Math.max(180, ((vp&&vp.clientHeight)||Math.floor(window.innerHeight*0.45)||300) - 8);
    const R=1.0;           // радиус центра дорожки
    const sep=1.48;        // разнос центров колец (>1 = дальше друг от друга)
    const laneW=0.62;      // толщина всей ленты (шире клетки)
    const modelW=(2*sep+2.4)*R;
    const modelH=2.7*R;
    const scale=Math.min(maxW/modelW, maxH/modelH)*0.95;
    const bw=Math.ceil(modelW*scale);
    const bh=Math.ceil(modelH*scale);
    el.style.display='block';el.style.position='relative';
    el.style.width=bw+'px';el.style.height=bh+'px';
    el.style.background='#3a3a42';
    el.style.borderRadius='14px';
    el.style.border='1px solid rgba(255,255,255,0.1)';
    el.innerHTML='';

    // SVG слой клеток-сегментов
    const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');
    svg.setAttribute('width', bw);
    svg.setAttribute('height', bh);
    svg.style.cssText='position:absolute;left:0;top:0;overflow:visible';
    el.appendChild(svg);

    // hit-area layer (transparent divs for clicks)
    const hits=document.createElement('div');
    hits.style.cssText='position:absolute;left:0;top:0;width:'+bw+'px;height:'+bh+'px;';
    el.appendChild(hits);

    function polar(cx, cy, r, ang){
      return [(cx + Math.cos(ang)*r + modelW/2)*scale, (cy + Math.sin(ang)*r + modelH/2)*scale];
    }
    function sectorPath(cx, cy, r0, r1, a0, a1){
      // annular sector path
      const large = (a1-a0) > Math.PI ? 1 : 0;
      const p0=polar(cx,cy,r1,a0), p1=polar(cx,cy,r1,a1);
      const p2=polar(cx,cy,r0,a1), p3=polar(cx,cy,r0,a0);
      // sweep
      return 'M'+p0[0]+','+p0[1]
        +' A'+ (r1*scale)+','+(r1*scale)+' 0 '+large+' 1 '+p1[0]+','+p1[1]
        +' L'+p2[0]+','+p2[1]
        +' A'+ (r0*scale)+','+(r0*scale)+' 0 '+large+' 0 '+p3[0]+','+p3[1]
        +' Z';
    }

    // half columns → left circle, half → right
    const halfN = Math.floor(W/2);

    for(let y=G.y0;y<G.y1;y++) for(let x=G.x0;x<G.x1;x++){
      if(!valid(x,y)) continue;
      const rx=x-G.x0, ry=y-G.y0;
      const left = rx < halfN;
      const local = left ? rx : (rx - halfN);
      const nAng = left ? halfN : (W - halfN);
      // угол сектора
      const a0 = -Math.PI/2 + (local / nAng) * Math.PI * 2;
      const a1 = -Math.PI/2 + ((local+1) / nAng) * Math.PI * 2;
      const cx = left ? -R*sep : R*sep;
      const cy = 0;
      // радиальные границы дорожки
      const t0 = ry / H;
      const t1 = (ry+1) / H;
      const rInner = (R - laneW*0.5) + t0 * laneW;
      const rOuter = (R - laneW*0.5) + t1 * laneW;

      const light = ((rx + ry) % 2 === 0);
      const path=document.createElementNS('http://www.w3.org/2000/svg','path');
      path.setAttribute('d', sectorPath(cx, cy, rInner, rOuter, a0, a1));
      path.setAttribute('fill', light ? '#e8e4d4' : '#6b8f5a');
      path.setAttribute('stroke', 'rgba(0,0,0,0.25)');
      path.setAttribute('stroke-width', '0.8');
      path.style.cursor='pointer';
      path.dataset.vx=x; path.dataset.vy=y;
      // highlight classes via data
      svg.appendChild(path);

      // center of sector for piece + hit
      const amid = (a0+a1)/2;
      const rmid = (rInner+rOuter)/2;
      const [sx,sy] = polar(cx, cy, rmid, amid);

      // selection / moves overlay
      const isSel = sel && sel.x===x && sel.y===y;
      const isMove = moves && moves.some(z=>z.x===x&&z.y===y);
      hl.forEach(h=>{
        if(h.x===x&&h.y===y){
          path.setAttribute('stroke', h.cls==='result-hot'?'#ff4d4d':'#4dff88');
          path.setAttribute('stroke-width', '2.5');
        }
      });
      if(isSel){ path.setAttribute('stroke','#f0c14b'); path.setAttribute('stroke-width','3'); }
      if(isMove){
        const dot=document.createElementNS('http://www.w3.org/2000/svg','circle');
        dot.setAttribute('cx', sx); dot.setAttribute('cy', sy);
        dot.setAttribute('r', Math.max(4, scale*0.06));
        dot.setAttribute('fill', B[y][x] ? 'rgba(180,40,40,0.7)' : 'rgba(0,0,0,0.35)');
        svg.appendChild(dot);
      }

      // click target
      const hit=document.createElement('div');
      const hs=Math.max(22, scale*laneW/H*1.05);
      hit.style.cssText='position:absolute;left:'+(sx-hs/2)+'px;top:'+(sy-hs/2)+'px;width:'+hs+'px;height:'+hs+'px;border-radius:50%;cursor:pointer;';
      hit.dataset.vx=x; hit.dataset.vy=y;
      hits.appendChild(hit);

      // piece
      {const g=GUNS.find(g=>g.x===x&&g.y===y);if(g)el.appendChild(floorGunEl(g,'abs',sx,sy,hs));}
      const p=B[y][x];
      if(p && !p.boss){
        const s=document.createElement('div');

// ---- вспомогательное ----
function gunAt(x,y){return GUNS.some(g=>g.x===x&&g.y===y);}
function totalGuns(){let n=GUNS.length;each(p=>{if(p.gun)n++;});return n;}
function nearestFree(x,y){
  let best=null,bd=1e9;
  for(let j=0;j<WN;j++)for(let i=0;i<WN;i++)if(valid(i,j)&&!B[j][i]){
    const d=Math.max(Math.abs(i-x),Math.abs(j-y))+Math.random()*0.1;
    if(d<bd){bd=d;best={x:i,y:j};}
  }
  return best;
}
function dropGun(x,y,ammo){
  if(!valid(x,y)){const c=nearestFree(x,y);if(!c)return;x=c.x;y=c.y;}
  if(!gunAt(x,y))GUNS.push({x,y,fresh:0,ammo:ammo||GUN_AMMO});
}
function pname(p){return (NAME[p.t]||'нейтрал')+' '+(SYM2[p.k]||'');}

// ---- gen: добавляем выстрелы ----
function gen(x,y,capOnly){
  const r=gen0(x,y,capOnly);
  if(capOnly)return r;
  const p=B[y][x];
  if(!p||!p.gun||p.shot||p.jail||p.frozen>0||p.lying>0||p.k==='J'||p.boss||p.t==='boss'||!valid(x,y))return r;
  const has=new Set(r.map(m=>m.x+','+m.y));
  for(let dy=-GUN_RANGE;dy<=GUN_RANGE;dy++)for(let dx=-GUN_RANGE;dx<=GUN_RANGE;dx++){
    if(!dx&&!dy)continue;
    const tx=x+dx,ty=y+dy;if(!valid(tx,ty))continue;
    const q=B[ty][tx];
    if(!q||q.boss||q.k==='J'||q.t===p.t||q.prot||q.shot)continue;
    r.push({x:tx,y:ty,cap:{x:tx,y:ty},shoot:1,dup:has.has(tx+','+ty)?1:0});
  }
  return r;
}
function apply(fx,fy,m){
  let r;
  lastFrom={x:fx,y:fy};
  if(m&&m.shoot)r=shootApply(fx,fy,m);
  else if(m&&m.steal)r=stealApply(fx,fy,m);
  else{
    const pp=B[fy][fx];
    if(pp&&pp.k==='N'&&!pp.ponyChk){pp.ponyChk=1;if(Math.random()<PONY_CHANCE){pp.k='Y';log('🐴 Конь оказался пони!');}}
    r=apply0(fx,fy,m);
    if(r&&r.k==='H'&&!m.merge)htScare(r,m.x,m.y);
  }
  try{settleGuns();resolveFalls();}catch(e){console.warn(e);}
  lastFrom=null;
  return r;
}
// выстрел: фигура не двигается, цель падает (лежит)
function shootApply(fx,fy,m){
  const p=B[fy][fx],tx=m.cap.x,ty=m.cap.y,q=B[ty][tx];
  if(!p||!q)return p;
  p.ammo=(p.ammo||GUN_AMMO)-1;
  log('🔫 '+pname(p)+' стреляет (патронов: '+Math.max(0,p.ammo)+')');
  if(p.ammo<=0){p.gun=false;p.ammo=0;log('Патроны кончились — пистолет выброшен');}
  addHl(tx,ty,'target-hl');
  if(q.boss||q.k==='J'||q.prot){log('Пуля никого не задела');return p;}
  if(q.shield){q.shield=false;log('Щит отразил пулю!');return p;}
  if(FW[q.t]&&angelGlowAt(tx,ty,q.t)&&Math.random()<0.78){log('Свет Ангела отразил пулю!');return p;}
  if(q.minion){burry(q,tx,ty);B[ty][tx]=null;log('Приспешник убит выстрелом');return p;}
  q.shot=true;q.shotT=0;
  log('Попадание! '+pname(q)+' лежит');
  return p;
}

// подбираем пистолет, если фигура стоит на его клетке
function settleGuns(){

  GUNS=GUNS.filter(g=>{
    if(!valid(g.x,g.y)){const c=nearestFree(g.x,g.y);if(c){g.x=c.x;g.y=c.y;return true;}return false;}

    if(!q||q.boss||q.t==='boss'||q.k==='J'||q.gun||q.shot||q.jail)return true;
    q.gun=true;q.ammo=g.ammo||GUN_AMMO;log('🔫 '+pname(q)+' подобрал пистолет ('+q.ammo+' патр.)');addHl(g.x,g.y,'effect-hl');
    return false;
  });
}

// ---- раненые: раз в 2 круга исчезают или встают ----
function shotRound(){
  const list=[];each((p,x,y)=>{if(p.shot)list.push({p,x,y});});
  list.forEach(({p,x,y})=>{
    p.shotT=(p.shotT||0)+1;if(p.shotT<2)return;p.shotT=0;
    const r=Math.random();
    if(r<SHOT_VANISH){burry(p,x,y);B[y][x]=null;log('💨 '+pname(p)+' (лежавшая) исчезла');}
    else if(r<SHOT_VANISH+SHOT_RISE){p.shot=false;log('🧍 '+pname(p)+' встала');}
  });
}

// ---- пистолет падает с неба: на пустую клетку, максимально далеко от всех фигур ----
function gunRound(){
  if(bossSt||over||GUNS.length||round<2||Math.random()>GUN_CHANCE||totalGuns()>=GUN_MAX_TOTAL)return;
  const pts=[];each((p,x,y)=>{pts.push([x,y]);});
  let best=-1,cells=[];
  for(let y=0;y<WN;y++)for(let x=0;x<WN;x++){
    if(!valid(x,y)||B[y][x])continue;
    let md=1e9;
    for(let i=0;i<pts.length;i++){const dx=pts[i][0]-x,dy=pts[i][1]-y,d=dx*dx+dy*dy;if(d<md){md=d;if(md<best)break;}}
    if(md>best){best=md;cells=[[x,y]];}else if(md===best)cells.push([x,y]);
  }
  if(!cells.length)return;
  const c=pick(cells);
  GUNS.push({x:c[0],y:c[1],fresh:Date.now(),ammo:GUN_AMMO});
  addHl(c[0],c[1],'effect-hl');
  log('🔫 С неба упал пистолет! Подбери его, встав на клетку');
}

// ---- Шут ----
function kingList(){return ORDER.filter(t=>alive(t)).map(t=>({t,p:kingPos(t)})).filter(k=>k.p);}
function jesterRound(){
  if(!JEST)JEST={phase:'idle',cd:3+Math.floor(Math.random()*4)};
  if(JEST.phase==='idle'){
    if(round<JEST.cd||bossSt||over||Math.random()>JESTER_CHANCE)return;
    return jesterSpawn();
  }
  if(JEST.phase==='walk')return jesterWalk();
  if(JEST.phase==='jail')return jesterJail();
}
function jesterSpawn(){
  const ks=kingList();if(ks.length<2)return;
  const a=pick(ks),adj=[];
  for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){
    const x=a.p.x+dx,y=a.p.y+dy;
    if((dx||dy)&&valid(x,y)&&!B[y][x]&&!gunAt(x,y))adj.push({x,y});
  }
  let c=adj.length?pick(adj):null;
  if(!c){const f=freeCells().filter(z=>!gunAt(z[0],z[1]));if(!f.length)return;const z=pick(f);c={x:z[0],y:z[1]};}
  const others=ks.filter(k=>k.t!==a.t);
  others.sort((u,v)=>Math.max(Math.abs(u.p.x-c.x),Math.abs(u.p.y-c.y))-Math.max(Math.abs(v.p.x-c.x),Math.abs(v.p.y-c.y)));
  B[c.y][c.x]={t:'neutral',k:'J',prot:true,buff:true};
  JEST={phase:'walk',x:c.x,y:c.y,a:a.t,b:others[0].t,cd:0};
  addHl(c.x,c.y,'effect-hl');
  log('🤡 Появился Шут! Он идёт к королю ('+NAME[others[0].t]+')');
}
function jesterGone(why){
  if(JEST&&inW(JEST.x,JEST.y)){const q=B[JEST.y][JEST.x];if(q&&q.k==='J')B[JEST.y][JEST.x]=null;}
  JEST={phase:'idle',cd:round+JESTER_COOLDOWN};
  if(why)log('🤡 '+why);
}
function jesterWalk(){
  const S=JEST,q=inW(S.x,S.y)&&B[S.y][S.x];
  if(!q||q.k!=='J'||!valid(S.x,S.y)){jesterGone(q&&q.k==='J'?'Шут ушёл с поля':null);return;}
  for(let s=0;s<JESTER_STEPS;s++){
    let bp=kingPos(S.b);
    if(!bp||!alive(S.b)){
      const ks=kingList().filter(k=>k.t!==S.a&&k.t!==S.b);
      if(!ks.length){jesterGone('Шуту некого забирать — он ушёл');return;}
      ks.sort((u,v)=>Math.max(Math.abs(u.p.x-S.x),Math.abs(u.p.y-S.y))-Math.max(Math.abs(v.p.x-S.x),Math.abs(v.p.y-S.y)));
      S.b=ks[0].t;bp=ks[0].p;
    }
    const d=Math.max(Math.abs(S.x-bp.x),Math.abs(S.y-bp.y));
    if(d<=2)return jesterAbduct();   // достаёт тростью через клетку — король может быть обложен своими фигурами
    const cur=(S.x-bp.x)**2+(S.y-bp.y)**2;
    let best=null,bd=1e9;
    for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){
      if(!dx&&!dy)continue;
      const nx=S.x+dx,ny=S.y+dy;
      if(!valid(nx,ny)||B[ny][nx]||gunAt(nx,ny))continue;
      const dd=(nx-bp.x)**2+(ny-bp.y)**2+Math.random()*0.3;
      if(dd<bd){bd=dd;best={x:nx,y:ny};}
    }
    if(!best||bd>cur+0.3){
      // перепрыгиваем через фигуры, если рядом всё занято
      let hop=null,hd=cur;
      for(let dy=-2;dy<=2;dy++)for(let dx=-2;dx<=2;dx++){
        if(Math.max(Math.abs(dx),Math.abs(dy))!==2)continue;
        const nx=S.x+dx,ny=S.y+dy;
        if(!valid(nx,ny)||B[ny][nx]||gunAt(nx,ny))continue;
        const dd=(nx-bp.x)**2+(ny-bp.y)**2+Math.random()*0.3;
        if(dd<hd){hd=dd;hop={x:nx,y:ny};}
      }
      if(!hop)break;
      best=hop;
    }
    B[best.y][best.x]=q;B[S.y][S.x]=null;S.x=best.x;S.y=best.y;
  }
}
// Шут забирает обоих королей за границу поля
function jesterAbduct(){
  const S=JEST;
  const ts=[S.b,S.a].filter((t,i,arr)=>arr.indexOf(t)===i);
  const items=[];
  ts.forEach(t=>{const p=kingPos(t);if(p)items.push({t,ox:p.x,oy:p.y});});
  if(!items.length){jesterGone('Шут разочарован и ушёл');return;}
  const cand=[];
  for(let y=0;y<WN;y++)for(let x=0;x<WN;x++){
    if(valid(x,y)||B[y][x])continue;
    cand.push({x,y,d:Math.max(Math.abs(x-S.x),Math.abs(y-S.y))+Math.random()*0.5});
  }
  cand.sort((u,v)=>u.d-v.d);
  if(cand.length<items.length+1){jesterGone('Шуту некуда увести королей');return;}
  items.forEach((it,i)=>{
    const c=cand[i],k=B[it.oy][it.ox];
    B[it.oy][it.ox]=null;k.jail=1;B[c.y][c.x]=k;it.jx=c.x;it.jy=c.y;
  });
  const jc=cand[items.length],jp=B[S.y][S.x];
  B[S.y][S.x]=null;if(jp){jp.jail=1;B[jc.y][jc.x]=jp;}
  JEST={phase:'jail',jailT:JAIL_ROUNDS,items,jx:jc.x,jy:jc.y,cd:0};
  sel=null;moves=null;
  log('🤡 Шут забрал королей ('+items.map(i=>NAME[i.t]).join(' и ')+') за границу поля!');
}
function jesterJail(){
  const S=JEST;S.jailT--;
  if(S.jailT>0){log('🤡 Короли ещё за границей: '+S.jailT+' кр.');return;}
  S.items.forEach(it=>{
    const q=inW(it.jx,it.jy)&&B[it.jy][it.jx];
    if(!q||q.k!=='K'||q.t!==it.t)return;
    B[it.jy][it.jx]=null;delete q.jail;
    const c=(valid(it.ox,it.oy)&&!B[it.oy][it.ox])?{x:it.ox,y:it.oy}:nearestFree(it.ox,it.oy);
    if(c){B[c.y][c.x]=q;addHl(c.x,c.y,'effect-hl');}else{q.jail=1;B[it.jy][it.jx]=q;}
  });
  const jq=inW(S.jx,S.jy)&&B[S.jy][S.jx];if(jq&&jq.k==='J')B[S.jy][S.jx]=null;
  JEST={phase:'idle',cd:round+JESTER_COOLDOWN};
  log('🤡 Шут вернул королей и скрылся');
}

const KN3=[[1,3],[3,1],[-1,3],[-3,1],[1,-3],[3,-1],[-1,-3],[-3,-1]];   // «длинная Г» Конницы
const BASEK={E:'R',T:'R',C:'N',G:'N',Y:'N',H:'B'};                     // какой стандартной фигурой считаются при «Сбросе»
const VARIANTS={R:['T','E'],N:['C','G'],B:['H','E']};
const KDESC={

  T:'Высокая Тура: ходит как Ладья. Погибая, падает на 3 клетки, убивает всех там и навсегда делает их стеной',
  Y:'Пони: ходит и бьёт на 1 клетку по диагонали',

};
NAME.wall='стена';
let variantNote='';
function hasVariants(){let n=0;each(p=>{if(p.t&&p.t!=='neutral'&&p.t!=='wall'&&p.k.length===1&&'ECHTGY'.includes(p.k))n++;});return n;}
function variantsInit(){
  const cnt={},made=[];
  each((p,x,y)=>{
    if(!p.t||!ORDER.includes(p.t)||RULE[p.t]!=='chess')return;
    const v=VARIANTS[p.k];
    if(v&&Math.random()<VARIANT_CHANCE){p.k=pick(v);cnt[p.t]=(cnt[p.t]||0)+1;made.push(p.k);}
  });
  // гарантия: у каждой шахматной стороны минимум VARIANT_MIN особых фигур
  ORDER.filter(t=>RULE[t]==='chess').forEach(t=>{
    const cand=[];each((p,x,y)=>{if(p.t===t&&VARIANTS[p.k])cand.push(p);});
    while((cnt[t]||0)<VARIANT_MIN&&cand.length){
      const p=cand.splice(Math.floor(Math.random()*cand.length),1)[0];
      p.k=pick(VARIANTS[p.k]);cnt[t]=(cnt[t]||0)+1;made.push(p.k);
    }
  });
  if(made.length){const N={E:'Слонь',C:'Конница',H:'Хтонь',T:'Высокая Тура',G:'Цыганский конь'};
    variantNote='✨ Особые фигуры в партии: '+made.map(k=>N[k]).join(', ');}
}

// Хтонь: пугает всех, кого «атакует» (линии ферзя и ходы коня, первая фигура на линии)
function htScare(p,x,y){
  const hit=[];
  const mark=(a,b)=>{const q=B[b]&&B[b][a];if(q&&q.t!==p.t&&!q.prot&&!q.boss&&q.t!=='boss'&&q.k!=='J'&&!q.wall&&!q.jail)hit.push(q);};
  O.concat(D).forEach(([dx,dy])=>{let a=x+dx,b=y+dy;while(valid(a,b)){if(B[b][a]){mark(a,b);break;}a+=dx;b+=dy;}});
  KN.forEach(([dx,dy])=>{if(valid(x+dx,y+dy))mark(x+dx,y+dy);});
  hit.forEach(q=>{q.frozen=Math.max(q.frozen||0,3);q.scared=true;});
  if(hit.length)log('😱 Хтонь пугает фигур: '+hit.length+' (3 хода не ходят)');
}
// три хода подряд за один ход
function htNext(m){
  if(m.shoot||m.steal||m.merge){htChain=null;return null;}
  const p=B[m.y][m.x];
  if(!p||p.k!=='H'){htChain=null;return null;}
  if(!htChain||htChain.p!==p)htChain={p,left:2};else htChain.left--;
  if(htChain.left<=0){htChain=null;return null;}
  const mv=gen(m.x,m.y);
  if(!mv.length){htChain=null;return null;}
  if(p.t===ORDER[ti])log('👻 Хтонь: ещё ход ('+htChain.left+') — или «Пропуск хода»');
  return mv;
}
// Цыганский конь: переманивает фигуру на свою сторону
function stealApply(fx,fy,m){
  const p=B[fy][fx],q=B[m.y][m.x];
  if(!p||!q)return p;
  addHl(m.x,m.y,'target-hl');
  if(q.shield){q.shield=false;log('Щит помешал краже!');return p;}
  if(q.prot||q.boss||q.k==='K'||q.k==='J'||q.wall||q.t===p.t)return p;
  const old=q.t;q.t=p.t;delete q.loan;delete q.dbl;
  log('🐎 Цыганский конь украл фигуру ('+(NAME[old]||'нейтралы')+' → '+NAME[p.t]+')');
  return p;
}
// Высокая Тура: падает и превращается в стену
function towerDie(q,x,y){
  let d=null;
  if(lastFrom){const dx=x-lastFrom.x,dy=y-lastFrom.y;if(dx||dy)d=Math.abs(dx)>=Math.abs(dy)?[Math.sign(dx),0]:[0,Math.sign(dy)];}
  if(!d)d=pick([[1,0],[-1,0],[0,1],[0,-1]]);
  TQ.push({x,y,d,t:q.t});
}
function wallPiece(){return {t:'wall',k:'W',prot:true,wall:true};}
function resolveFalls(){
  let guard=0;
  while(TQ.length&&guard++<30){
    const f=TQ.shift(),cells=[];let dead=0;
    for(let i=1;i<=LONGROOK_LEN;i++){
      const nx=f.x+f.d[0]*i,ny=f.y+f.d[1]*i;
      if(!valid(nx,ny))break;
      const q=B[ny][nx];
      if(q&&(q.boss||q.k==='J'))break;
      if(q&&!q.wall){burry(q,nx,ny);dead++;}
      B[ny][nx]=wallPiece();cells.push([nx,ny]);
    }
    if(cells.length){FALLEN.push({x:f.x,y:f.y,d:f.d,cells,t:f.t,t0:Date.now()});}
    log('🗼 Высокая Тура упала: раздавлено фигур '+dead+', клеток перекрыто навсегда: '+cells.length);
  }
}
function placeWalls(){
  FALLEN.forEach(f=>f.cells.forEach(([x,y])=>{
    if(!valid(x,y))return;
    const q=B[y][x];if(q&&q.wall)return;
    if(q){if(q.boss||q.k==='J')return;burry(q,x,y);}
    B[y][x]=wallPiece();
  }));
  resolveFalls();
}
function drawFallen(el,x0,y0){
  FALLEN.forEach(f=>{
    const cs=f.cells;if(!cs||!cs.length)return;
    const u=figTinted('T',f.t);if(!u)return;
    const n=cs.length,a=cs[0],b=cs[n-1];
    const cx=((a[0]+b[0])/2-x0)*40+20,cy=((a[1]+b[1])/2-y0)*40+20;
    const rot=f.d[0]>0?90:(f.d[0]<0?-90:(f.d[1]>0?180:0));
    const box=document.createElement('div');
    box.style.cssText='position:absolute;left:'+(cx-20)+'px;top:'+(cy-n*20)+'px;width:40px;height:'+(n*40)+'px;transform:rotate('+rot+'deg);pointer-events:none;z-index:5';
    const im=document.createElement('img');im.src=u;im.alt='';im.draggable=false;
    im.style.cssText='width:100%;height:100%;object-fit:contain;display:block;pointer-events:none';
    box.appendChild(im);el.appendChild(box);
  });
}

/* ═══════════════════════════════════════════════════════════════════════════
   ◄► СВЯЗЬ С accounts.js  (регистрация, вход, таблицы лидеров)
   Игра НЕ содержит код аккаунтов. Она только сообщает о событиях через мост
   GameEvents (он создан выше, в отдельном script-теге в index.html), а файл
   accounts.js на них подписан (см. блок «подписка на события игры» там).

     start()      → game:start {teams, shape}   (accounts.js сбрасывает счётчик)
     ход белых    → game:move  {moves}          (accounts.js запоминает число ходов)
     победа белых → game:win   {moves,teams,shape}  (accounts.js пишет в Supabase)

   Обратное направление: accounts.js вызывает GameAPI.showResultNote(текст),
   и мы дописываем его на экране победы (#go-reason).
   ═══════════════════════════════════════════════════════════════════════════ */
let myMoves=0;            // сколько ходов сделали белые (игрок) в текущей партии
{
  const _doMove2=doMove;
  doMove=function(fx,fy,m,cb){
    const p=B[fy]&&B[fy][fx];
    if(p&&p.t==='white'&&!over){myMoves++;GameEvents.emit('game:move',{moves:myMoves});}   // ◄► → accounts.js
    return _doMove2(fx,fy,m,cb);
  };
  const _end2=end;
  end=function(win,why){
    const r=_end2(win,why);
    // победа в одиночной игре (не по сети) → сообщаем accounts.js
    if(win&&!(typeof onlineMode!=='undefined'&&onlineMode)&&myMoves>0)
      GameEvents.emit('game:win',{moves:myMoves,teams:(CFG&&CFG.teams)||2,shape:(CFG&&CFG.shape)||'p'});   // ◄► → accounts.js
    return r;
  };
  const _start2=start;
  start=function(){
    myMoves=0;
    const r=_start2.apply(this,arguments);
    GameEvents.emit('game:start',{teams:(CFG&&CFG.teams)||2,shape:(CFG&&CFG.shape)||'p'});          // ◄► → accounts.js
    return r;
  };
}
