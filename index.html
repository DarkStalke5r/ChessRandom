      el.style.transform=`translate(${x1-x0}px, ${y1-y0}px) scale(1.05)`;
      setTimeout(()=>{ el.remove(); }, 1150);
    }


    const ITEM_DEFS={
      future:{name:'Будущее',type:'future'},
      spawn:{name:'Спавн',type:'spawn'},
      airstrike:{name:'Авиаудар',type:'airstrike'},
      support:{name:'Поддержка',type:'support'},
      shield:{name:'Щит',type:'shield'},
      extra:{name:'2-й ход',type:'extra'},
      angel:{name:'Ангел',type:'angel'},
      reset:{name:'Сброс',type:'reset', rare:true},
      chaos:{name:'Мигание',type:'chaos'},
      nuclear:{name:'Ядерка',type:'nuclear', rare:true}
    };
    // weighted card drops (reset is rare, chaos uncommon; nuclear not in random pool)
    const CARD_WEIGHTS = {
      future:12, spawn:14, airstrike:12, support:14, shield:12, extra:10, angel:10, reset:3, chaos:8
    };
    function pickRandomCardId(){
      const entries=Object.entries(CARD_WEIGHTS);
      let total=entries.reduce((s,[,w])=>s+w,0);
      let r=Math.random()*total;
      for(const [id,w] of entries){ r-=w; if(r<=0) return id; }
      return 'spawn';
    }
    function pickWeightedBuff(){
      // more common -> shield; rarer -> angel; rarest -> both
      const r=Math.random();
      if(r<0.55) return {shield:true};
      if(r<0.85) return {angel:true};
      return {shield:true, angel:true};
    }
    function softResetBoard(){
      // collect all living pieces (board + frozen + future); neutrals vanish
      const pool={white:{K:[],Q:[],R:[],B:[],N:[],P:[]}, black:{K:[],Q:[],R:[],B:[],N:[],P:[]}};
      function addP(p){
        if(!p) return;
        const o=pieceOwner(p);
        if(o==='neutral') return;
        const t=pieceChar(p).toUpperCase();
        if(!pool[o][t]) pool[o][t]=[];
        pool[o][t].push(p);
      }
      for(let y=0;y<boardH;y++) for(let x=0;x<boardW;x++) addP(board[y][x]);
      frozen.forEach(f=>addP(f.piece));
      futureQueue.forEach(f=>addP(f.piece));
      frozen=[]; futureQueue=[];

      const nb=createEmpty(boardW,boardH);
      const file0 = Math.max(0, Math.floor((boardW-8)/2));
      const files = [];
      for(let i=0;i<8;i++) if(file0+i<boardW) files.push(file0+i);
      const backB=0, pawnB=1, pawnW=boardH-2, backW=boardH-1;
      // standard order on back rank
      const backOrder=['R','N','B','Q','K','B','N','R'];

      function placeSide(color, isWhite){
        const placed=[]; // pieces we put down
        const extras=[];
        const take=(t)=>{
          const arr=pool[color][t]||[];
          if(!arr.length) return null;
          return arr.shift();
        };
        // Keep merge extras + buffs from the actual piece taken from the pool
        const toHomePiece=(p, needType)=>{
          const homeBase = isWhite ? needType.toLowerCase() : needType;
          const src = ensureObj(p) || {base:homeBase, extra:[], merged:false, shield:false, angel:false};
          const extra = (src.extra||[])
            .map(e=>String(e).toLowerCase())
            .filter(e=>e && e!==homeBase.toLowerCase());
          // if original base type differed (e.g. merged queen placed on rook home), keep that movement too
          const origBase = String(pieceChar(p)||'').toLowerCase();
          if(origBase && origBase!==homeBase.toLowerCase() && !extra.includes(origBase)){
            extra.push(origBase);
          }
          return {
            base: homeBase,
            extra: [...new Set(extra)],
            merged: !!(src.merged || extra.length),
            shield: !!src.shield,
            angel: !!src.angel
          };
        };
        // place back rank
        if(isWhite ? backW>=0 && backW<boardH : backB>=0 && backB<boardH){
          const ry = isWhite ? backW : backB;
          for(let i=0;i<files.length && i<8;i++){
            const need=backOrder[i];
            let p=take(need);
            if(!p) continue;
            const obj = toHomePiece(p, need);
            nb[ry][files[i]]=obj;
            placed.push({x:files[i],y:ry,p:obj,t:need});
          }
        }
        // pawns
        const py = isWhite ? pawnW : pawnB;
        if(py>=0 && py<boardH){
          for(let i=0;i<files.length && i<8;i++){
            let p=take('P');
            if(!p) continue;
            const obj = toHomePiece(p, 'P');
            nb[py][files[i]]=obj;
            placed.push({x:files[i],y:py,p:obj,t:'P'});
          }
        }
        // remaining in pool = extras → random buffs stacked onto placed pieces
        for(const t of Object.keys(pool[color])){
          while(pool[color][t].length){
            extras.push({t, p:pool[color][t].shift()});
          }
        }
        extras.forEach(ex=>{
          if(!placed.length) return;
          const target=placed[Math.floor(Math.random()*placed.length)];
          const buff=pickWeightedBuff();
          // also transfer buffs from the sacrificed extra piece itself
          const src = ensureObj(ex.p);
          const cur=nb[target.y][target.x];
          nb[target.y][target.x]=withFlags(cur, {
            shield: !!(cur.shield||buff.shield||(src&&src.shield)),
            angel: !!(cur.angel||buff.angel||(src&&src.angel))
          });
        });
        return extras.length;
      }
      const exW=placeSide('white', true);
      const exB=placeSide('black', false);
      board=nb;
      // reset castling rights lightly
      whiteKingMoved=false; blackKingMoved=false;
      whiteRookA=false; whiteRookH=false; blackRookA=false; blackRookH=false;
      rebuildAngelZones();
      return {exW, exB};
    }

    function giveItem(id,toAI=false){
      const def=ITEM_DEFS[id]; if(!def) return false;
      const arr=toAI?aiSlots:slots;
      const empty=arr.findIndex(s=>!s); if(empty===-1) return false;
      arr[empty]={...def,id, deal:true};
      if(!toAI) log('Карта: '+def.name);
      haptic('success'); return true;
    }
    function clearSlot(item, fromReserve){
      if(fromReserve || selectedSlot==='reserve'){
        playerReserve=null;
      } else {
        const i=slots.findIndex(s=>s===item); if(i!==-1) slots[i]=null;
        // also by reference miss: clear first matching type if still present
        if(item && slots.every(s=>s!==item)){
          /* already cleared */
        }
      }
      selectedSlot=null;
    }
    /** Consume card immediately so it can't be double-fired during animation */
    function consumeCardNow(item, fromReserve){
      clearSlot(item, fromReserve);
      selected=null; possibleMoves=[];
      renderCards();
    }

    function useItem(item,x,y,fromReserve){
      if(window._cardBusy || moving) return false;
      if(!item) return false;
      // already removed from hand?
      if(!fromReserve && selectedSlot!=='reserve'){
        const still=slots.some(s=>s===item);
        if(!still && selectedSlot!=null && slots[selectedSlot]!==item) return false;
      }
      const markUndo=()=>{ if(turn==='white') pushUndoSnapshot(); };
      if(item.type==='future'){
        if(!inBounds(x,y)||!board[y][x]||pieceOwner(board[y][x])!=='white'){ log('Выбери свою фигуру'); return false; }
        if(window._cardBusy) return false;
        markUndo();
        pendingFuture={x,y,piece:board[y][x],item, fromReserve:!!fromReserve};
        // don't consume until confirmed in picker
        document.getElementById('future-picker').classList.add('show');
        return true;
      }
      if(item.type==='spawn'){
        if(!inBounds(x,y)||board[y][x]){ log('Нужна пустая клетка'); return false; }
        markUndo();
        consumeCardNow(item, fromReserve);
        playCardUseAnim(item, [{x,y}], ()=>{
          board[y][x]=['n','b','r','p','q'][Math.floor(Math.random()*5)];
          log('Спавн!'); haptic('medium'); showTip('spawn');
        });
        return true;
      }
      if(item.type==='airstrike'){
        if(!inBounds(x,y)){ log('Укажи клетку'); return false; }
        const zone=[];
        for(let dy=-1;dy<=1;dy++) for(let dx=-1;dx<=1;dx++){
          const nx=x+dx, ny=y+dy;
          if(inBounds(nx,ny)) zone.push({x:nx,y:ny});
        }
        markUndo();
        consumeCardNow(item, fromReserve);
        playCardUseAnim(item, zone, ()=>{
          showCrosshairOnCell(x,y, HL_MS);
          scatterArea(x,y);
          log('Авиаудар! Фигуры разлетелись');
          haptic('medium'); showTip('airstrike');
          rebuildAngelZones();
        });
        return true;
      }
      if(item.type==='support'){
        const boardEl=document.getElementById('board');
        const mid = boardEl ? [{x:Math.floor(boardW/2), y:Math.floor(boardH/2)}] : [];
        markUndo();
        consumeCardNow(item, fromReserve);
        playCardUseAnim(item, mid, ()=>{
          const forWhite=Math.random()<0.6; const pawn=forWhite?'p':'P';
          let placed=0; const cells=[];
          for(let i=0;i<50&&placed<2;i++){
            const rx=Math.floor(Math.random()*boardW), ry=Math.floor(Math.random()*boardH);
            if(!board[ry][rx]){ board[ry][rx]=pawn; cells.push({x:rx,y:ry}); placed++; }
          }
          highlightCells(cells, 'effect-hl', HL_MS);
          log(forWhite?`+${placed} твоих пешек`:`Врагу +${placed}`);
          haptic(forWhite?'success':'error'); showTip('support');
        });
        return true;
      }
      if(item.type==='shield'){
        if(!inBounds(x,y)||!board[y][x]||pieceOwner(board[y][x])!=='white'){ log('Выбери свою фигуру'); return false; }
        markUndo();
        consumeCardNow(item, fromReserve);
        playCardUseAnim(item, [{x,y}], ()=>{
          board[y][x]=withFlags(board[y][x], {shield:true});
          log('Щит наложен'); haptic('success'); showTip('shield');
        });
        return true;
      }
      if(item.type==='extra'){
        const mid=[{x:Math.floor(boardW/2), y:Math.floor(boardH/2)}];
        markUndo();
        consumeCardNow(item, fromReserve);
        playCardUseAnim(item, mid, ()=>{
          extraMove=true;
          log('2-й ход активен — походи ещё раз после хода');
          haptic('success'); showTip('extra');
        });
        return true;
      }
      if(item.type==='reset'){
        const mid=[{x:Math.floor(boardW/2), y:Math.floor(boardH/2)}];
        const all=[];
        for(let yy=0;yy<boardH;yy++) for(let xx=0;xx<boardW;xx++) all.push({x:xx,y:yy});
        markUndo();
        consumeCardNow(item, fromReserve);
        playCardUseAnim(item, mid, ()=>{
          const r=softResetBoard();
          highlightCells(all.slice(0, Math.min(all.length, 32)), 'effect-hl', HL_MS);
          log('Сброс =) лишние → бафы ('+((r.exW||0)+(r.exB||0))+')');
          haptic('success'); showTip('reset');
        });
        return true;
      }
      if(item.type==='angel'){
        if(!inBounds(x,y)||!board[y][x]||pieceOwner(board[y][x])!=='white'){ log('Выбери свою фигуру'); return false; }
        const glow=[{x,y}];
        for(let dy=1; dy<=4; dy++) for(let dx=-1; dx<=1; dx++){
          const nx=x+dx, ny=y-dy;
          if(inBounds(nx,ny)) glow.push({x:nx,y:ny});
        }
        markUndo();
        consumeCardNow(item, fromReserve);
        playCardUseAnim(item, glow, ()=>{
          board[y][x]=withFlags(board[y][x], {angel:true});
          log('Ангел! Крылья и нимб');
          haptic('success'); showTip('angel'); rebuildAngelZones();
        });
        return true;
      }
      if(item.type==='chaos'){
        const rx=Math.floor(Math.random()*boardW), ry=Math.floor(Math.random()*boardH);
        markUndo();
        consumeCardNow(item, fromReserve);
        playCardUseAnim(item, [{x:rx,y:ry}], ()=>{
          applyChaosEffect(rx, ry);
          haptic('medium');
        });
        return true;
      }
      if(item.type==='nuclear'){
        if(!nukeRitual || nukeRitual.phase!=='fire' || nukeRitual.owner!=='white'){
          log('Ядерку можно выстрелить только после ритуала защиты');
          return false;
        }
        if(!inBounds(x,y)){ log('Укажи клетку удара'); return false; }
        markUndo();
        const zone=nuclearZone(x,y);
        consumeCardNow(item, fromReserve);
        playCardUseAnim(item, zone, ()=>{
          resolveNuclearStrike(x,y,'white');
          haptic('error');
        });
        return true;
      }
      return false;
    }

    function applyChaosEffect(x, y){
      // random effect among: bang, demon, airstrike, spawn, shield
      const pool=['bang','bang','demon','airstrike','spawn','shield'];
      const eff=pool[Math.floor(Math.random()*pool.length)];
      highlightCells([{x,y}], 'effect-hl', HL_MS);
      if(eff==='airstrike'){
        showCrosshairOnCell(x,y, HL_MS);
        scatterArea(x,y);
        log('Хаос → авиаудар!');
        showTip('airstrike');
        rebuildAngelZones();
        return;
      }
      if(eff==='spawn'){
        if(!board[y][x]){
          board[y][x]=['n','b','r','p','q'][Math.floor(Math.random()*5)];
          log('Хаос → спавн!');
        } else {
          log('Хаос → спавн мимо (клетка занята)');
        }
        showTip('spawn');
        return;
      }
      if(eff==='shield'){
        if(board[y][x] && pieceOwner(board[y][x])!=='neutral'){
          board[y][x]=withFlags(board[y][x], {shield:true});
          log('Хаос → щит на фигуре');
          showTip('shield');
        } else if(!board[y][x]){
          // bang-like neutral instead
          spawnNeutralAt(x,y);
        } else {
          board[y][x]=withFlags(board[y][x], {shield:true});
          log('Хаос → щит');
        }
        return;
      }
      if(eff==='demon'){
        if(board[y][x]){
          board[y][x]=withFlags(board[y][x], {demon:true, angel:false});
          log('Хаос → демон!');
        } else {
          // empty: spawn neutral demon knight
          board[y][x]={base:'n', extra:[], merged:false, neutral:true, demon:true, shield:false, angel:false};
          log('Хаос → нейтральный демон!');
          showTip('neutral_unit');
        }
        showTip('demon');
        rebuildAngelZones();
        return;
      }
      // bang
      if(!board[y][x]){
        spawnNeutralAt(x,y);
      } else {
        // scatter that cell
        showCrosshairOnCell(x,y, HL_MS);
        const p=board[y][x];
        board[y][x]=null;
        // try place nearby or offboard
        let placed=false;
        for(let r=1;r<=3&&!placed;r++){
          for(let dy=-r;dy<=r&&!placed;dy++) for(let dx=-r;dx<=r&&!placed;dx++){
            if(Math.abs(dx)!==r && Math.abs(dy)!==r) continue;
            const nx=x+dx, ny=y+dy;
            if(inBounds(nx,ny)&&!board[ny][nx]){ board[ny][nx]=p; placed=true; }
          }
        }
        if(!placed) pushOffboard(x-1,y,p);
        log('Хаос → бах!');
        showTip('airstrike');
      }
    }
    function spawnNeutralAt(x,y){
      const types=['p','n','b','r','q'];
      const base=types[Math.floor(Math.random()*types.length)];
      const buff=pickWeightedBuff();
      board[y][x]={
        base, extra:[], merged:false, neutral:true,
        shield:!!buff.shield, angel:false, demon:false
      };
      log('Хаос → нейтральный юнит!');
      showTip('neutral_unit');
      haptic('success');
    }

    function nuclearZone(cx,cy){
      // 3 width × 4 height, centered on impact
      const cells=[];
      for(let dy=-2;dy<=1;dy++) for(let dx=-1;dx<=1;dx++){
        const x=cx+dx, y=cy+dy;
        if(inBounds(x,y)) cells.push({x,y});
      }
      return cells;
    }

    function forceTetoSay(msg, then){
      // temporary tip without localStorage lock
      const tut=document.getElementById('tutorial');
      const text=tut && tut.querySelector('.text');
      if(text) text.textContent=msg;
      if(tut){ tut.classList.add('show'); tut.classList.remove('hiding'); }
      tutActive=true;
      const next=document.getElementById('tut-next');
      const skip=document.getElementById('tut-skip');
      const finish=()=>{
        tutActive=false;
        if(tut){ tut.classList.add('hiding'); setTimeout(()=>tut.classList.remove('show','hiding'), 350); }
        if(next) next.onclick=closeTip;
        if(skip) skip.onclick=closeTip;
        if(then) then();
      };
      if(next) next.onclick=finish;
      if(skip) skip.onclick=finish;
      // auto-continue if user slow
      setTimeout(()=>{ if(tutActive) finish(); }, 5200);
    }

    function animateOppFutureCards(side, done){

      hand.innerHTML='';

      const zoneEl = side==='white'
        ? document.getElementById('player-zone')
        : document.getElementById('ai-zone');

    function aiPickProtect(){
      const side = nukeRitual.owner==='white'?'black':'white';
      const pieces=[];
      for(let y=0;y<boardH;y++) for(let x=0;x<boardW;x++){
        const p=board[y][x];
        if(p && pieceOwner(p)===side){
          const v=VAL[String(pieceChar(p)).toLowerCase()]||1;
          pieces.push({x,y,v});
        }
      }
      pieces.sort((a,b)=>b.v-a.v);
      nukeRitual.protected = pieces.slice(0,3).map(p=>({x:p.x,y:p.y}));
      finishProtectPhase();
    }

    function tryPickProtect(x,y){
      if(!nukeRitual || nukeRitual.phase!=='protect') return false;
      // defender is the side WITHOUT nuclear
      const def = nukeRitual.owner==='white'?'black':'white';
      if(nukeRitual.owner==='black'){
        // player is defender
        const p=board[y][x];
        if(!p || pieceOwner(p)!=='white'){ log('Выбери свою фигуру'); return true; }
        if(nukeRitual.protected.some(c=>c.x===x&&c.y===y)) return true;
        nukeRitual.protected.push({x,y});
        log('Защита '+nukeRitual.protected.length+'/3: '+cellLabel(x,y));
        render();
        if(nukeRitual.protected.length>=3) finishProtectPhase();
        return true;
      }
      return false;
    }

    function finishProtectPhase(){
      document.getElementById('nuke-protect-hint').classList.remove('show');
      forceTetoSay('На этом всё. Держитесь.', ()=>{
        document.getElementById('nuke-ritual-ui').classList.remove('show');
        nukeRitual.phase='fire';
        window._cardBusy=false;
        log(nukeRitual.owner==='white'
          ? 'Только ядерка: выбери клетку удара'
          : 'ИИ может только выстрелить ядеркой…');
        render();
        if(nukeRitual.owner==='black'){
          setTimeout(aiFireNuclear, 600);
        }
      });
    }

    function aiFireNuclear(){
      if(!nukeRitual || nukeRitual.owner!=='black') return;
      // aim near white king or center
      const wk=findKing('white');
      let tx=Math.floor(boardW/2), ty=Math.floor(boardH/2);
      if(wk && !wk.frozen && !wk.future){ tx=wk.x; ty=wk.y; }
      // consume nuclear from AI hand
      const idx=aiSlots.findIndex(s=>s&&s.type==='nuclear');
      if(idx>=0) aiSlots[idx]=null;
      resolveNuclearStrike(tx,ty,'black');
    }

    function resolveNuclearStrike(cx,cy,owner){
      // protected → future for 2 pairs of turns (4 half-moves) — guaranteed survival
      (nukeRitual?.protected||[]).forEach(c=>{
        if(!inBounds(c.x,c.y) || !board[c.y][c.x]) return;
        const p=board[c.y][c.x];
        board[c.y][c.x]=null;
        futureQueue.push({turnsLeft:4, x:c.x, y:c.y, piece:p, owner:pieceOwner(p)});
      });
      const zone=nuclearZone(cx,cy);
      highlightCells(zone, 'nuke-blast', 9000);
      showCrosshairOnCell(cx,cy, 8500);
      nukeRitual=null;
      window._cardBusy=true;
      document.getElementById('nuke-ritual-ui').classList.remove('show');
      log('Ядерка запущена… 8 секунд до удара');
      render();

      // 8s silence, then rocket
      let left=8;
      const tick=setInterval(()=>{
        left--;
        if(left>0) log('До удара: '+left+'…');
      }, 1000);

      setTimeout(()=>{
        clearInterval(tick);
        // rocket from sky
        playRocketAnim(cx,cy, ()=>{
          // impact: wipe zone
          const victims=[];
          zone.forEach(({x,y})=>{
            const p=board[y][x];
            if(p){ victims.push({x,y}); board[y][x]=null; }
          });
          log('УДАР! Зона очищена');
          haptic('error');
          rebuildAngelZones();
          render();

          setTimeout(()=>{
            // rebirth as red at same cells
            const reds=victims.map(v=>{
              board[v.y][v.x]={
                base:'p', extra:[], merged:false, neutral:false,
                red:true, shield:false, angel:false, demon:false
              };
              return {x:v.x,y:v.y};
            });
            log('Перерождение… красные сходятся к эпицентру');
            render();
            convergeReds(reds, cx, cy, ()=>{
              spawnBoss3x3(cx, cy);
              enterBossMode();
              window._cardBusy=false;
              afterMove();
            });
          }, 1000);
        });
      }, 8000);
    }

    function playRocketAnim(tx,ty, done){
      const boardEl=document.getElementById('board');
      const cell=boardEl && boardEl.children[ty*boardW+tx];
      const fly=document.getElementById('fly');
      const vp=document.getElementById('viewport');
      if(!cell||!fly||!vp){ if(done) done(); return; }
      const wrap=vp.getBoundingClientRect();
      const tr=cell.getBoundingClientRect();
      const x1=tr.left-wrap.left+tr.width/2;
      const y1=tr.top-wrap.top+tr.height/2;
      fly.innerHTML='';
      fly.className='piece';
      fly.style.display='flex';
      fly.style.transition='none';
      fly.style.left=(x1)+'px';
      fly.style.top='-48px';
      fly.style.transform='translate(-50%,0) scale(1.35)';
      {
        // by default the texture lives next to Teto's layers; custom ROCKET texture overrides it
        const img=document.createElement('img');
        img.src=rocketTexture || 'teto-layers/Rocket.png';
        img.alt='rocket';
        img.style.width='48px';
        img.style.height='64px';
        img.style.objectFit='contain';
        img.style.pointerEvents='none';
        img.onerror=()=>{ img.remove(); fly.textContent='🚀'; };
        fly.appendChild(img);
      }
      void fly.offsetWidth;
      fly.style.transition='transform 0.85s cubic-bezier(0.4,0,0.2,1)';
      requestAnimationFrame(()=>{
        fly.style.transform=`translate(-50%, ${y1+48}px) scale(1.05)`;
      });
      setTimeout(()=>{
        fly.style.display='none';
        fly.style.transition='none';
        fly.innerHTML='';
        if(done) done();
      }, 900);
    }

    function convergeReds(reds, cx, cy, done){
      if(!reds.length){ if(done) done(); return; }
      const step=()=>{
        let moved=false;
        reds.forEach(r=>{
          if(!board[r.y]||!board[r.y][r.x]||!board[r.y][r.x].red) return;
          const dx=Math.sign(cx-r.x), dy=Math.sign(cy-r.y);
          // prefer axis toward epicenter, one cell
          let nx=r.x, ny=r.y;
          if(dx!==0) nx=r.x+dx;
          else if(dy!==0) ny=r.y+dy;
          if(nx===r.x && ny===r.y) return;
          if(!inBounds(nx,ny)) return;
          // if target occupied by another red, still try alternate
          if(board[ny][nx] && !(board[ny][nx].red && nx===cx && ny===cy)){
            if(dy!==0 && inBounds(r.x, r.y+dy) && !board[r.y+dy][r.x]){ ny=r.y+dy; nx=r.x; }
            else if(dx!==0 && inBounds(r.x+dx, r.y) && !board[r.y][r.x+dx]){ nx=r.x+dx; ny=r.y; }
            else return;
          }
          board[ny][nx]=board[r.y][r.x];
          board[r.y][r.x]=null;
          r.x=nx; r.y=ny;
          moved=true;
        });
        render();
        const allClose=reds.every(r=>Math.abs(r.x-cx)+Math.abs(r.y-cy)<=1);
        if(!moved || allClose){
          // clear remaining reds into boss
          reds.forEach(r=>{ if(board[r.y]&&board[r.y][r.x]&&board[r.y][r.x].red) board[r.y][r.x]=null; });
          if(done) done();
          return;
        }
        setTimeout(step, 1000);
      };
      setTimeout(step, 1000);
    }

    function spawnBoss3x3(cx,cy){
      let mx=Math.max(0, Math.min(boardW-3, cx-1));
      let my=Math.max(0, Math.min(boardH-3, cy-1));
      // clear all leftover red walkers everywhere
      for(let y=0;y<boardH;y++) for(let x=0;x<boardW;x++){
        const p=board[y][x];
        if(p && p.red && !p.boss) board[y][x]=null;
      }
      for(let dy=0;dy<3;dy++) for(let dx=0;dx<3;dx++){
        if(inBounds(mx+dx,my+dy)) board[my+dy][mx+dx]=null;
      }
      const boss={
        base:'P', extra:[], merged:true, mega:true, boss:true, radio:true,
        neutral:false, red:true, shield:false, angel:false, demon:false
      };
      board[my][mx]=boss;
      megaPawns=[{x:mx,y:my,size:3}];
      log('Босс-пешка 3×3 явилась!');
      summonBossMinions(mx, my);
      render();
    }

    function makeRedMinion(){
      return {
        base:'p', extra:[], merged:false, red:true, redMinion:true,
        boss:false, neutral:false, shield:false, angel:false, demon:false,
        oneshot:true
      };
    }
    function summonBossMinions(bx, by){
      // up to 2 red pawns near boss, normal size, oneshot, move like boss
      const spots=[];
      for(let dy=-2;dy<=4;dy++) for(let dx=-2;dx<=4;dx++){
        const x=bx+dx, y=by+dy;
        if(!inBounds(x,y)) continue;
        if(isBossCell(x,y)) continue;
        if(board[y][x]) continue;
        spots.push({x,y});
      }
      spots.sort(()=>Math.random()-0.5);
      let n=0;
      for(const s of spots){
        if(n>=2) break;
        board[s.y][s.x]=makeRedMinion();
        n++;
      }
      if(n) log('Босс призвал '+n+' красных пешек-миньонов');
    }
    function countRedMinions(){
      let c=0;
      for(let y=0;y<boardH;y++) for(let x=0;x<boardW;x++){
        const p=board[y][x];
        if(p && p.redMinion) c++;
      }
      return c;
    }
    /** Kill every non-boss piece standing on boss 3×3 footprint (including kings) */
    function bossDigest(){
      const m=megaPawns.find(mm=>{
        const p=board[mm.y]&&board[mm.y][mm.x];
        return p&&p.boss;
      });
      if(!m) return;
      const sz=m.size||3;
      for(let dy=0;dy<sz;dy++) for(let dx=0;dx<sz;dx++){
        const x=m.x+dx, y=m.y+dy;
        if(!inBounds(x,y)) continue;
        const t=board[y][x];
        if(!t || t.boss) continue;
        // oneshot minions of boss shouldn't be on footprint anyway
        if(t.redMinion){ board[y][x]=null; continue; }
        if(pieceChar(t).toUpperCase()==='K'){
          const def=pieceOwner(t);
          board[y][x]=null;
          if(def==='white') transferWhiteToAI('Босс раздавил белого короля');
          else if(def==='black') log('Босс раздавил чёрного короля');
          else log('Босс раздавил короля');
        } else {
          board[y][x]=null;
          log('Босс раздавил фигуру на '+cellLabel(x,y));
        }
      }
    }
    function moveRedMinions(dx, dy){
      // move all minions one step same direction as boss (if free)
      const list=[];
      for(let y=0;y<boardH;y++) for(let x=0;x<boardW;x++){
        const p=board[y][x];
        if(p && p.redMinion) list.push({x,y,p});
      }
      // move from far side first to avoid collisions
      list.sort((a,b)=>(b.x*dx+b.y*dy)-(a.x*dx+a.y*dy));
      list.forEach(({x,y,p})=>{
        const nx=x+dx, ny=y+dy;
        if(!inBounds(nx,ny)) return;
        if(isBossCell(nx,ny)) return;
        const t=board[ny][nx];
        if(t){
          if(t.boss || t.redMinion) return;
          // oneshot capture anything they step on
          if(pieceChar(t).toUpperCase()==='K'){
            const def=pieceOwner(t);
            board[ny][nx]=null;
            if(def==='white') transferWhiteToAI('Миньон босса съел белого короля');
            else log('Миньон босса съел фигуру');
          } else {
            board[ny][nx]=null;
          }
        }
        board[y][x]=null;
        board[ny][nx]=p;
      });
    }

    function transferWhiteToAI(reason){
      if(whiteAIControl) return;
      whiteAIControl=true;
      log(reason||'Белый король пал — армия белых под контролем ИИ');
      // strip any remaining white kings just in case
      for(let y=0;y<boardH;y++) for(let x=0;x<boardW;x++){
        const p=board[y][x];
        if(p && pieceOwner(p)==='white' && pieceChar(p).toUpperCase()==='K') board[y][x]=null;
      }
      render();
    }

    function enterBossMode(){
      bossMode=true;
      bossHP=bossMaxHP;
      // expand board to 13×13, keep pieces centered
      const newW=13, newH=13;
      const offX=Math.floor((newW-boardW)/2);
      const offY=Math.floor((newH-boardH)/2);
      const nb=createEmpty(newW,newH);
      for(let y=0;y<boardH;y++) for(let x=0;x<boardW;x++){
        if(board[y][x]) nb[y+offY][x+offX]=board[y][x];
      }
      megaPawns=megaPawns.map(m=>({x:m.x+offX,y:m.y+offY,size:m.size||3}));
      futureQueue.forEach(f=>{ f.x+=offX; f.y+=offY; });
      frozen.forEach(f=>{ f.x+=offX; f.y+=offY; });
      boardW=newW; boardH=newH; board=nb;
      bossBudget={ movesLeft:4, attacksLeft:1, pieceUsed:{} };
      log('БОСС-ФАЙТ! Поле 13×13. 4 хода / макс 2 одной фигурой / 1 атака. Цель: 20 ударов по боссу.');
      forceTetoSay('После ядерного удара трупы поднялись и начали двигаться. Будьте осторожны и попытайтесь выжить — победить чёрных уже не имеет смысла.', ()=>{});
      camScale=Math.min(camScale, 0.85); applyCam();
      rebuildAngelZones();
      render();
    }

    function isBossCell(x,y){
      const m=getMegaAt(x,y);
      if(!m) return false;
      // footprint always counts in boss mode even if glyph missing
      if(bossMode) return true;
      const p=board[m.y]&&board[m.y][m.x];
      return !!(p && p.boss);
    }
    function isMegaCell(x,y){
      return !!getMegaAt(x,y);
    }
    function getMegaAt(x,y){
      return megaPawns.find(m=>{
        const sz=m.size||3;
        return x>=m.x&&x<m.x+sz&&y>=m.y&&y<m.y+sz;
      });
    }
    function findBossPiece(){
      for(let y=0;y<boardH;y++) for(let x=0;x<boardW;x++){
        const p=board[y][x];
        if(p && p.boss) return {x,y,p};
      }
      return null;
    }
    /** If boss vanished — slide in from board edge and take an extra turn */
    function ensureBossPresent(then){
      if(!bossMode || gameOver){ if(then) then(); return; }
      const found=findBossPiece();
      if(found){
        // resync mega origin to actual piece
        const sz=3;
        let mx=Math.max(0, Math.min(boardW-sz, found.x));
        let my=Math.max(0, Math.min(boardH-sz, found.y));
        // if piece not at top-left of footprint, move reference
        if(!megaPawns.some(m=>m.x===found.x&&m.y===found.y)){
          megaPawns=[{x:found.x,y:found.y,size:sz}];
        }
        if(then) then();
        return;
      }
      // respawn from edge
      log('Босс исчез… возвращается с края поля!');
      const sz=3;
      const side=Math.floor(Math.random()*4);
      let mx, my;
      if(side===0){ mx=0; my=Math.floor(Math.random()*(boardH-sz)); }
      else if(side===1){ mx=boardW-sz; my=Math.floor(Math.random()*(boardH-sz)); }
      else if(side===2){ my=0; mx=Math.floor(Math.random()*(boardW-sz)); }
      else { my=boardH-sz; mx=Math.floor(Math.random()*(boardW-sz)); }
      for(let dy=0;dy<sz;dy++) for(let dx=0;dx<sz;dx++){
        if(inBounds(mx+dx,my+dy)) board[my+dy][mx+dx]=null;
      }
      const boss={
        base: bossPhase2?'B':'P', extra:[], merged:true, mega:true, boss:true, radio:true,
        neutral:false, red:true, officer:!!bossPhase2, shield:false, angel:false, demon:false
      };
      board[my][mx]=boss;
      megaPawns=[{x:mx,y:my,size:sz}];
      highlightCells(
        [{x:mx,y:my},{x:mx+1,y:my},{x:mx+2,y:my},{x:mx,y:my+1},{x:mx+1,y:my+1},{x:mx+2,y:my+1},{x:mx,y:my+2},{x:mx+1,y:my+2},{x:mx+2,y:my+2}],
        'nuke-blast', 1200
      );
      render();
      // out-of-turn boss move
      setTimeout(()=>{
        bossAITurn(()=>{
          log('Босс снова на поле');
          if(then) then();
        });
      }, 600);
    }

    function hitBoss(fromLabel){
      bossHP--;
      log('Удар по боссу! HP '+bossHP+'/'+bossMaxHP+(fromLabel?' ('+fromLabel+')':''));
      haptic('medium');
      // Phase 2 at 5 HP: becomes officer (bishop), 5 diagonal moves
      if(!bossPhase2 && bossHP>0 && bossHP<=5){
        bossPhase2=true;
        const m=megaPawns.find(mm=>{
          const p=board[mm.y]&&board[mm.y][mm.x];
          return p&&p.boss;
        });
        if(m){
          const bp=board[m.y][m.x];
          if(bp){
            bp.officer=true;
            bp.base='B';
            bp.extra=[];
          }
        }
        log('2-я фаза! Босс стал ОФИЦЕРОМ (ходит только по диагонали, 5 раз за ход)');
        forceTetoSay('Босс ослаб и стал офицером! Он ходит по диагонали, но уже 5 раз за ход. Черным лучше держаться подальше.', ()=>{});
        render();
      }
      if(bossHP<=0){
        // remove boss
        megaPawns.forEach(m=>{
          const sz=m.size||3;
          for(let dy=0;dy<sz;dy++) for(let dx=0;dx<sz;dx++){
            if(inBounds(m.x+dx,m.y+dy)) board[m.y+dy][m.x+dx]=null;
          }
        });
        megaPawns=[];
        bossMode=false;
        endGame('white', 'Примирение: обе стороны конфликта заключили мирное соглашение, хоть и не без потерь…', [], {
          how:'Босс уничтожен. Война окончена миром.'
        });
        document.getElementById('go-text').textContent='Примирение';
        return true;
      }
      return false;
    }

    function bossDistTo(x,y){
      const m=megaPawns.find(mm=>{
        const p=board[mm.y]&&board[mm.y][mm.x];
        return p&&p.boss;
      });
      if(!m) return 99;
      const sz=m.size||3;
      // distance to nearest cell of footprint
      let best=99;
      for(let dy=0;dy<sz;dy++) for(let dx=0;dx<sz;dx++){
        best=Math.min(best, Math.abs(x-(m.x+dx))+Math.abs(y-(m.y+dy)));
      }
      return best;
    }

    // Boss fight: loss if not a single white piece is left (on board or waiting in the future)
    function bossWipedOut(){
      if(!bossMode || gameOver) return false;
      for(let y=0;y<boardH;y++) for(let x=0;x<boardW;x++){
        const p=board[y][x];
        if(p && pieceOwner(p)==='white') return false;
      }
      if(futureQueue.some(f=>f && f.owner==='white' && f.piece)) return false;
      endGame('black','Босс съел все белые фигуры.',[],{how:'Ты проиграл: на доске не осталось ни одной белой фигуры.'});
      return true;
    }

    function bossAITurn(done){
      if(!bossMode || gameOver){ if(done) done(); return; }
      let m=megaPawns.find(mm=>{
        const p=board[mm.y]&&board[mm.y][mm.x];
        return p&&p.boss;
      });
      if(!m || !(board[m.y]&&board[m.y][m.x]&&board[m.y][m.x].boss)){
        ensureBossPresent(()=>{ if(done) done(); });
        return;
      }
      // crush anyone already standing inside
      bossDigest();
      // refill minions up to 2
      if(countRedMinions()<2){
        const cur=megaPawns[0];
        if(cur) summonBossMinions(cur.x, cur.y);
      }
      // aggro: nearest non-boss, non-red piece
      let best=null, bestD=999;
      for(let y=0;y<boardH;y++) for(let x=0;x<boardW;x++){
        const p=board[y][x];
        if(!p || p.boss || p.red || p.redMinion) continue;
        const d=bossDistTo(x,y);
        if(d<bestD){ bestD=d; best={x,y}; }
        else if(d===bestD && best){
          const v=VAL[String(pieceChar(p)).toLowerCase()]||1;
          const bv=VAL[String(pieceChar(board[best.y][best.x])).toLowerCase()]||1;
          if(v>bv) best={x,y};
        }
      }
      const steps=bossPhase2?5:2;
      let step=0;
      const doStep=()=>{
        if(bossWipedOut()) return;
        if(gameOver || step>=steps){
          bossDigest();
          if(bossWipedOut()) return;
          if(done) done();
          return;
        }
        step++;
        const cur=megaPawns.find(mm=>board[mm.y]&&board[mm.y][mm.x]&&board[mm.y][mm.x].boss);
        if(!cur){ if(done) done(); return; }
        const sz=cur.size||3;
        const cx=cur.x+Math.floor(sz/2), cy=cur.y+Math.floor(sz/2);
        let tdx=0, tdy=0;
        if(best){
          tdx=Math.sign(best.x-cx);
          tdy=Math.sign(best.y-cy);
        } else {
          tdx=Math.random()<0.5?1:-1;
          tdy=Math.random()<0.5?1:-1;
        }
        let dx=0, dy=0;
        if(bossPhase2){
          dx=tdx|| (Math.random()<0.5?1:-1);
          dy=tdy|| (Math.random()<0.5?1:-1);
          if(dx===0) dx=Math.random()<0.5?1:-1;
          if(dy===0) dy=Math.random()<0.5?1:-1;
        } else {
          if(Math.abs(tdx)>=Math.abs(tdy) && tdx) dx=tdx;
          else if(tdy) dy=tdy;
          else if(tdx) dx=tdx;
          else { dx=Math.random()<0.5?1:-1; dy=0; }
        }
        const nx=cur.x+dx, ny=cur.y+dy;
        if(nx<0||ny<0||nx+sz>boardW||ny+sz>boardH){
          setTimeout(doStep, 280);
          return;
        }
        // clear NEW footprint completely (no skip — was letting kings live inside)
        for(let yy=0;yy<sz;yy++) for(let xx=0;xx<sz;xx++){
          const tx=nx+xx, ty=ny+yy;
          if(!inBounds(tx,ty)) continue;
          const t=board[ty][tx];
          if(!t || t.boss) continue;
          if(pieceChar(t).toUpperCase()==='K'){
            const def=pieceOwner(t);
            board[ty][tx]=null;
            if(def==='white') transferWhiteToAI('Босс съел белого короля — армия белых под ИИ');
            else if(def==='black') log('Босс съел чёрного короля');
            else log('Босс съел короля');
          } else if(!t.redMinion){
            board[ty][tx]=null;
          } else {
            board[ty][tx]=null; // minions shouldn't block
          }
        }
        const piece=board[cur.y][cur.x];
        board[cur.y][cur.x]=null;
        board[ny][nx]=piece;
        cur.x=nx; cur.y=ny;
        moveRedMinions(dx, dy);
        bossDigest();
        if(bossWipedOut()) return;
        log('Босс ходит ('+step+'/'+steps+')'+(bossPhase2?' [офицер]':''));
        render();
        setTimeout(doStep, 360);
      };
      doStep();
    }

    document.querySelectorAll('#future-box button[data-t]').forEach(btn=>{

    function aiPlayWhiteBoss(){
      if(!bossMode || gameOver || turn!=='white' || !whiteAIControl) return;
      // spend remaining white budget attacking boss / repositioning
      const tryOnce=()=>{
        if(gameOver || bossBudget.movesLeft<=0){ afterMove(); return; }
        let best=null, bestScore=-1;
        for(let y=0;y<boardH;y++) for(let x=0;x<boardW;x++){
          const p=board[y][x];
          if(!p || pieceOwner(p)!=='white') continue;
          if(!p._uid) ensurePieceUid(p,x,y);
          if((bossBudget.pieceUsed[p._uid]||0)>=2) continue;
          const moves=getLegalMoves(x,y);
          moves.forEach(m=>{
            let sc=1;
            if(m.bossHit || isBossCell(m.x,m.y)) sc=100;
            if(sc>bestScore){ bestScore=sc; best={fx:x,fy:y,tx:m.x,ty:m.y,castle:m.castle,hit:sc>=100}; }
          });
        }
        if(!best){ afterMove(); return; }
        if(best.hit && bossBudget.attacksLeft<=0){
          // only non-attacks left
          best=null; bestScore=-1;
          for(let y=0;y<boardH;y++) for(let x=0;x<boardW;x++){
            const p=board[y][x];
            if(!p || pieceOwner(p)!=='white') continue;
            if((bossBudget.pieceUsed[p._uid]||0)>=2) continue;
            getLegalMoves(x,y).forEach(m=>{
              if(m.bossHit || isBossCell(m.x,m.y)) return;
              if(1>bestScore){ bestScore=1; best={fx:x,fy:y,tx:m.x,ty:m.y}; }
            });
          }
          if(!best){ afterMove(); return; }
        }
        doMove(best.fx,best.fy,best.tx,best.ty,best.castle||null);
        // doMove may afterMove or leave budget
        if(turn==='white' && bossMode && !gameOver && bossBudget.movesLeft>0){
          setTimeout(tryOnce, 320);
        }
      };
      tryOnce();
    }

    function onCellClick(x,y){
      if(gameOver||moving) return;
      if(whiteAIControl && bossMode){ log('Белыми управляет ИИ'); return; }
      if(nukeRitual && nukeRitual.phase==='protect'){
        if(tryPickProtect(x,y)) return;
      }
      if(tutActive||window._cardBusy) return;
      // With nuclear in hand — only nuclear actions allowed
      if(hasNuclearCard('white') && turn==='white'){
        if(selectedSlot!==null){
          let item=null;
          const fromRes = selectedSlot==='reserve';
          if(fromRes) item=playerReserve&&playerReserve.item;
          else item=slots[selectedSlot];
          if(item && item.type==='nuclear'){ useItem(item,x,y, fromRes); return; }
          log('Пока есть ядерка — можно только выстрелить ей');
          return;
        }
        // auto-select nuclear if present
        const ni=slots.findIndex(s=>s&&s.type==='nuclear');
        if(ni>=0){
          selectedSlot=ni; selected=null; possibleMoves=[];
          useItem(slots[ni], x, y, false);
          return;
        }
        log('Пока есть ядерка — ходы фигурами недоступны');
        return;
      }
      if(selectedSlot!==null){
        let item=null;
        const fromRes = selectedSlot==='reserve';
        if(fromRes){
          if(playerReserve && !playerReserve.autoOnly && playerReserve.readyAt<=turnCount)
            item=playerReserve.item;
        } else {
          if(turn!=='white') return; // hand only on your turn
          item=slots[selectedSlot];
        }
        if(item) useItem(item,x,y, fromRes);
        return;
      }
      if(turn!=='white') return;

    }


    /** Auto king-save uses ONLY reserve future (one-shot). Hand futures must be played manually. */
    function findFutureCard(owner){
      const res = owner==='white' ? playerReserve : aiReserve;
      if(res && res.item && res.item.type==='future') return {where:'reserve', owner};
      return null;
    }
    function consumeFutureCard(ref){
      if(!ref) return;
      if(ref.where==='hand' && ref.arr){
        ref.arr[ref.idx]=null;
      } else {
        if(ref.owner==='white') playerReserve=null;
        else aiReserve=null;
      }
      // hard-clear so king cannot be saved again by the same card
      if(ref.owner==='black') aiReserve=null;
      if(ref.owner==='white') playerReserve=null;
    }
    /** Auto-save king with reserve «Будущее» for 8 pairs. Card is always spent. */
    function tryKingFutureSave(owner, kx, ky, kingPiece){
      const ref = findFutureCard(owner);
      if(!ref) return false;
      consumeFutureCard(ref);
      futureQueue.push({
        turnsLeft: 8*2,
        x: kx, y: ky,
        piece: kingPiece,
        owner: owner
      });
      log(owner==='white'
        ? 'Король спасён резервом «Будущее» на 8 пар — карта потрачена!'
        : 'Король ИИ спасён «Будущим» на 8 пар — резерв потрачен!');
      haptic('success');
      renderCards();
      return true;
    }

    function ensurePieceUid(p, x, y){
      // strings can't hold _uid — promote to object on the board
      if(!p) return null;
      if(typeof p==='string'){
        p={base:p, extra:[], merged:false, shield:false, angel:false, demon:false, neutral:false};
        if(inBounds(x,y)) board[y][x]=p;
      } else if(typeof p!=='object'){
        return null;
      }
      if(!p._uid){
        ensurePieceUid._seq=(ensurePieceUid._seq||0)+1;
        p._uid='p'+ensurePieceUid._seq+'_'+Math.random().toString(36).slice(2,7);
      }
      return p;
    }
    function doMove(fx,fy,tx,ty,castle){
      if(turn==='white') pushUndoSnapshot();
      let piece=board[fy][fx];
      let captured=board[ty][tx];
      // boss-mode budgets for white: 4 moves total, max 2 per unique piece, 1 attack
      if(bossMode && turn==='white'){
        piece=ensurePieceUid(piece, fx, fy);
        if(!piece){ log('Нет фигуры'); return; }
        const key=piece._uid;
        const used=bossBudget.pieceUsed[key]||0;
        if(bossBudget.movesLeft<=0){ log('Лимит ходов в босс-фазе (4)'); return; }
        if(used>=2){ log('Этой фигурой уже 2 раза в этот ход'); return; }
        const isAtk=!!(captured&&(captured.boss||captured.red||isBossCell(tx,ty))) || isBossCell(tx,ty);
        if(isAtk && bossBudget.attacksLeft<=0){ log('Атака уже была в этот ход'); return; }
        bossBudget.movesLeft--;
        bossBudget.pieceUsed[key]=used+1;
        if(isAtk) bossBudget.attacksLeft--;
      }
      // oneshot red minions: any hit kills them
      if(bossMode && captured && captured.redMinion){
        board[ty][tx]=null;
        board[fy][fx]=null;
        piece = maybePromote(piece, tx, ty);
        board[ty][tx]=piece;
        log('Миньон уничтожен с одного удара');
        selected=null; possibleMoves=[];
        rebuildAngelZones();
        if(bossMode && turn==='white' && bossBudget.movesLeft>0){ render(); return; }
        afterMove();
        return;
      }
      // boss hit: damage instead of capturing block
      if(bossMode && piece && !piece.boss && (isBossCell(tx,ty) || (captured&&(captured.boss||captured.red)))){
        // if somehow standing on footprint after — digest next
        if(hitBoss(describePiece(piece))) return;
        selected=null; possibleMoves=[];
        rebuildAngelZones();
        bossDigest();
        if(bossMode && turn==='white' && bossBudget.movesLeft>0){
          render();
          return;
        }
        afterMove();
        return;
      }
      // mega slide (non-boss controlled rare)
      if(piece && (piece.mega||piece.radio) && !piece.boss){
        const origin=getMegaAt(fx,fy)||{x:fx,y:fy,size:3};
        const sz=origin.size||3;
        for(let yy=0;yy<sz;yy++) for(let xx=0;xx<sz;xx++){
          if(inBounds(origin.x+xx,origin.y+yy)) board[origin.y+yy][origin.x+xx]=null;
        }
        megaPawns=megaPawns.filter(m=>!(m.x===origin.x&&m.y===origin.y));
        megaPawns.push({x:tx,y:ty,size:sz});
        board[ty][tx]=piece;
        selected=null; possibleMoves=[];
        rebuildAngelZones();
        afterMove();
        return;
      }
      if(castle){
        if(castle==='K'){ board[fy][5]=board[fy][7]; board[fy][7]=null; }
        else { board[fy][3]=board[fy][0]; board[fy][0]=null; }
      }
      if(piece && pieceChar(piece).toUpperCase()==='K'){ if(isWhite(piece)) whiteKingMoved=true; else blackKingMoved=true; }
      if(piece && pieceChar(piece).toUpperCase()==='R'){
        if(isWhite(piece)){ if(fx===0) whiteRookA=true; if(fx===7) whiteRookH=true; }
        else { if(fx===0) blackRookA=true; if(fx===7) blackRookH=true; }
      }

      // Shield on target: bounce attacker back, drop shield (other states stay)
      if(captured && (captured.shield || (typeof captured==='object' && captured.shield))){
        if(pieceOwner(captured)!==pieceOwner(piece)){
          log('Щит отразил удар!');
          haptic('medium');
          board[ty][tx]=withFlags(captured, {shield:false});
          board[fy][fx]=piece;
          selected=null; possibleMoves=[];
          afterMove();
          return;
        }
      }

      // Angel glow protection for defender's side: 78% reflect like shield
      if(captured && pieceOwner(captured)!==pieceOwner(piece)){
        const defOwner=pieceOwner(captured);
        if(inAngelGlow(tx,ty, defOwner) && Math.random()<0.78){
          log('Свет Ангела отразил атаку!');
          haptic('medium');
          board[fy][fx]=piece; // stay
          selected=null; possibleMoves=[];
          afterMove();
          return;
        }
      }

      if(captured&&pieceOwner(captured)===pieceOwner(piece)){
        board[ty][tx]=mergePieces(piece, captured);
        log('Слияние!'); haptic('success'); showTip('merge');
      } else {
        if(captured&&pieceChar(captured).toUpperCase()==='K'){
          const defOwner=pieceOwner(captured);
          if(tryKingFutureSave(defOwner, tx, ty, captured)){
            piece = maybePromote(piece, tx, ty);
            board[ty][tx]=piece;
            board[fy][fx]=null;
            selected=null; possibleMoves=[];
            rebuildAngelZones();
            afterMove();
            return;
          }
          board[fy][fx]=null;
          board[ty][tx]=piece; // attacker stays on kill square for visual
          const winner = pieceOwner(piece)==='neutral'
            ? (defOwner==='white'?'black':'white')
            : pieceOwner(piece);
          const killInfo={
            kingLabel: cellLabel(tx,ty),
            killerLabel: describePiece(piece),
            fromLabel: cellLabel(fx,fy),
            how: defOwner==='white'
              ? 'Ты проиграл: твоего короля взяли.'
              : 'Чёрный король уничтожен.'
          };
          const reason = (defOwner==='white'?'Поражение: ':'Победа: ')
            + describePiece(piece)+' взял '+describePiece(captured)
            +' на '+cellLabel(tx,ty)+' (ход с '+cellLabel(fx,fy)+').';
          endGame(winner, reason, [
            {x:tx,y:ty,cls:'result-hot'},
            {x:fx,y:fy,cls:'result-ok'}
          ], killInfo);
          return;
        }
        piece = maybePromote(piece, tx, ty);
        board[ty][tx]=piece;
      }
      // promote after friendly merge too (pawn-base merges)
      if(board[ty][tx]) board[ty][tx]=maybePromote(board[ty][tx], tx, ty);
      board[fy][fx]=null; selected=null; possibleMoves=[];
      rebuildAngelZones();
      if(bossMode && turn==='white' && bossBudget.movesLeft>0){
        log('Босс-фаза: ещё ходов '+bossBudget.movesLeft+', атак '+bossBudget.attacksLeft);
        render();
        return;
      }
      afterMove();
    }


    function processFuture(){
      const next=[];
      futureQueue.forEach(f=>{
        f.turnsLeft--;
        if(f.turnsLeft>0){ next.push(f); return; }
        if(!inBounds(f.x,f.y)){ frozen.push({x:f.x,y:f.y,piece:f.piece,owner:f.owner}); return; }
        // Returning into boss footprint → boss eats the piece (never overwrite boss)
        if(bossMode && (isBossCell(f.x,f.y) || (board[f.y][f.x]&&(board[f.y][f.x].boss||board[f.y][f.x].red)))){
          log('Босс уничтожил фигуру, вернувшуюся из будущего на '+cellLabel(f.x,f.y));
          return;
        }
        const existing=board[f.y][f.x];
        if(!existing){
          board[f.y][f.x]=maybePromote(f.piece, f.x, f.y);
          log('Вернулась из будущего');
        } else if(pieceOwner(existing)!==f.owner){
          if(existing.boss || existing.red){
            log('Босс уничтожил вернувшуюся фигуру');
            return;
          }
          board[f.y][f.x]=f.piece;
          log('Вернулась и съела');
          if(pieceChar(existing).toUpperCase()==='K'){
            const defOwner=pieceOwner(existing);
            if(tryKingFutureSave(defOwner, f.x, f.y, existing)){
              board[f.y][f.x]=f.piece;
            } else {
              const winner = f.owner==='neutral'
                ? (defOwner==='white'?'black':'white')
                : f.owner;
              const reason = describePiece(f.piece)+' вернулся из будущего и взял '
                +describePiece(existing)+' на '+cellLabel(f.x,f.y)+'.';
              endGame(winner, reason, [{x:f.x,y:f.y,cls:'result-hot'}], {
                kingLabel: cellLabel(f.x,f.y),
                killerLabel: describePiece(f.piece)+' (из будущего)',
                fromLabel: 'будущее',
                how: defOwner==='white'?'Ты проиграл: короля съела фигура из будущего.':'Чёрный король съеден из будущего.'
              });
            }
          }
          if(board[f.y][f.x]) board[f.y][f.x]=maybePromote(board[f.y][f.x], f.x, f.y);
        } else {
          // ally merge: stack movement + buffs
          board[f.y][f.x]=mergePieces(f.piece, existing);
          board[f.y][f.x]=maybePromote(board[f.y][f.x], f.x, f.y);
          log('Слияние при возврате');
        }
        haptic('medium');
      });
      futureQueue=next;
    }

    function checkEnd(){
      const wk=findKing('white'), bk=findKing('black');
      if(bossMode){
        // in boss fight kings dying doesn't end the game (white army → AI)
        if(!wk && !whiteAIControl) transferWhiteToAI('Белый король пал — ИИ ведёт белых дальше');
        if(bossWipedOut()) return true;
        // black king death also doesn't end boss fight
        return false;
      }
      if(!wk){
        endGame('black', 'Белый король уничтожен или исчез с доски.', [], {
          how: 'Ты проиграл: белый король больше не на поле (уничтожен / вне доски без возврата).'
        });
        return true;
      }
      if(!bk){
        endGame('white', 'Чёрный король уничтожен или исчез с доски.', [], {
          how: 'Победа: чёрный король исчез с доски.'
        });
        return true;
      }
      if(turn==='neutral') return false;
      if(!hasAnyLegalMove(turn)){
        const k = turn==='white' ? wk : bk;
        // King away (future/frozen) or pieces blocked — do NOT softlock: skip turn
        if(k && (k.frozen || k.future)){
          return false; // caller / skip handles pass
        }
        // true stalemate/mate with king on board
        const loser=turn;
        const winner=loser==='white'?'black':'white';
        const reason = inCheck(loser)
          ? (loser==='white' ? 'Мат белым: королю некуда уйти.' : 'Мат чёрным: королю некуда уйти.')
          : (loser==='white' ? 'Белым нечем ходить (пат/нет ходов).' : 'Чёрным нечем ходить (пат/нет ходов).');
        const hl = (k && !k.frozen && !k.future) ? [{x:k.x,y:k.y,cls:'result-hot'}] : [];
        endGame(winner, reason, hl);
        return true;
      }
      return false;
    }

    function canSkipWhite(){
      // Always allow skip on your turn (except game over)
      return !gameOver && turn==='white';
    }
    /** @param alreadyAdvanced if true — processFuture/turnCount уже сделаны в afterMove */
    function clonePiece(p){
      if(!p) return null;
      if(typeof p==='string') return p;
      return {
        base:p.base,
        extra:Array.isArray(p.extra)?p.extra.slice():[],
        merged:!!p.merged, shield:!!p.shield, angel:!!p.angel,
        demon:!!p.demon, neutral:!!p.neutral
      };
    }
    function snapshotState(){
      return {
        board: board.map(row=>row.map(clonePiece)),
        boardW, boardH,
        frozen: frozen.map(f=>({x:f.x,y:f.y,owner:f.owner,stepsLeft:f.stepsLeft,piece:clonePiece(f.piece)})),
        futureQueue: futureQueue.map(f=>({turnsLeft:f.turnsLeft,x:f.x,y:f.y,owner:f.owner,piece:clonePiece(f.piece)})),
        slots: slots.map(s=>s?{...s}:null),
        aiSlots: aiSlots.map(s=>s?{...s}:null),
        playerReserve: playerReserve?{...playerReserve, item:playerReserve.item?{...playerReserve.item}:null}:null,
        aiReserve: aiReserve?{...aiReserve, item:aiReserve.item?{...aiReserve.item}:null}:null,
        turn, turnCount, extraMove,
        whiteKingMoved, blackKingMoved, whiteRookA, whiteRookH, blackRookA, blackRookH,
        gameOver
      };
    }
    function pushUndoSnapshot(){
      // only store player-turn checkpoints
      undoStack.push(snapshotState());
      if(undoStack.length>8) undoStack.shift();
      consecutiveUndos=0;
      updateUndoBtn();
    }
    function restoreState(s){
      board=s.board.map(row=>row.map(clonePiece));
      boardW=s.boardW; boardH=s.boardH;
      frozen=s.frozen.map(f=>({...f, piece:clonePiece(f.piece)}));
      futureQueue=s.futureQueue.map(f=>({...f, piece:clonePiece(f.piece)}));
      slots=s.slots.map(x=>x?{...x}:null);
      aiSlots=s.aiSlots.map(x=>x?{...x}:null);
      playerReserve=s.playerReserve?{...s.playerReserve, item:s.playerReserve.item?{...s.playerReserve.item}:null}:null;
      aiReserve=s.aiReserve?{...s.aiReserve, item:s.aiReserve.item?{...s.aiReserve.item}:null}:null;
      turn=s.turn; turnCount=s.turnCount; extraMove=!!s.extraMove;
      whiteKingMoved=s.whiteKingMoved; blackKingMoved=s.blackKingMoved;
      whiteRookA=s.whiteRookA; whiteRookH=s.whiteRookH;
      blackRookA=s.blackRookA; blackRookH=s.blackRookH;
      gameOver=!!s.gameOver;
      selected=null; possibleMoves=[]; selectedSlot=null; pendingFuture=null;
      window._cardBusy=false; moving=false;
      rebuildAngelZones();
    }
    function undoMove(){
      if(gameOver){ log('Игра окончена'); return; }
      if(consecutiveUndos>=2){ log('Не больше 2 отмен подряд'); return; }
      if(!undoStack.length){ log('Нечего отменять'); return; }
      if(window._cardBusy||moving){ window._cardBusy=false; moving=false; }
      const s=undoStack.pop();
      restoreState(s);
      consecutiveUndos++;
      document.getElementById('game-over').classList.remove('show');
      log('Ход отменён ('+consecutiveUndos+'/2)');
      haptic('medium');
      render();
      updateUndoBtn();
    }
    function updateUndoBtn(){
      const btn=document.getElementById('undo-btn');
      if(!btn) return;
      const can=!gameOver && undoStack.length>0 && consecutiveUndos<2;
      btn.disabled=!can;
      btn.style.opacity=can?'1':'0.35';
      btn.textContent= consecutiveUndos>0 ? `Отмена (${consecutiveUndos}/2)` : 'Отмена';
    }

    function passTurn(reason, alreadyAdvanced){
      if(gameOver) return;
      window._cardBusy=false; moving=false;
      log(reason||'Ход пропущен');
      selected=null; possibleMoves=[]; selectedSlot=null;
      try { document.getElementById('future-picker').classList.remove('show'); } catch(e){}
      pendingFuture=null;
      if(!alreadyAdvanced){
        processFuture();
        processOffboard();
        turnCount++;
        if(!bossMode) maybeRandomResize();
        if(checkEnd()) return;
        if(turnCount>0 && turnCount%3===0 && !bossMode){
          const id=pickRandomCardId();
          const next=nextTurn(turn);
          if(next==='white') giveItem(id, false);
          else if(next==='black') giveItem(id, true);
        }
      }
      turn = nextTurn(turn);
      rebuildAngelZones();
      window._cardBusy=false; moving=false;
      render();
      if(gameOver) return;
      if(turn==='neutral'){
        setTimeout(()=>{ try{ neutralTurn(); }catch(e){ turn='white'; render(); } }, 350);
        return;
      }
      if(!hasAnyLegalMove(turn)){
        const k=findKing(turn);
        if(k && (k.frozen || k.future)){
          setTimeout(()=>passTurn(turn==='white'?'Белый король вне поля — пропуск':'Король ИИ вне поля — пропуск', false), 500);
          return;
        }
        if(checkEnd()) return;
      }
      if(turn==='black' && !gameOver){
        setTimeout(()=>{ try{ aiTurn(); }catch(e){ turn='neutral'; moving=false; window._cardBusy=false; render(); setTimeout(neutralTurn, 300); } }, 400);
      } else {
        updateSkipBtn();
      }
    }
    function updateSkipBtn(){
      const btn=document.getElementById('skip-btn');
      if(!btn) return;
      const can = canSkipWhite();
      btn.disabled = !can;
      btn.style.pointerEvents = can ? 'auto' : 'none';
      btn.style.opacity = can ? '1' : '0.35';
      btn.textContent = 'Пропуск хода';
    }

    function endGame(winner, reason, highlights, killInfo){
      gameOver=true;
      lastEndWinner=winner;
      const lines=[];
      if(reason) lines.push(reason);
      if(killInfo){
        if(killInfo.how) lines.push(killInfo.how);
        if(killInfo.kingLabel) lines.push('Клетка короля: '+killInfo.kingLabel);
        if(killInfo.killerLabel) lines.push('Кто убил: '+killInfo.killerLabel);
        if(killInfo.fromLabel) lines.push('Откуда ход: '+killInfo.fromLabel+(killInfo.kingLabel?' → '+killInfo.kingLabel:''));
      }
      lastEndReason=lines.filter(Boolean).join('\n');
      lastEndHighlight=highlights||[];
      // also highlight remaining kings
      const wk=findKing('white'), bk=findKing('black');
      if(wk && !wk.frozen && !wk.future && !lastEndHighlight.some(h=>h.x===wk.x&&h.y===wk.y))
        lastEndHighlight.push({x:wk.x,y:wk.y,cls: winner==='white'?'result-ok':'result-hot'});
      if(bk && !bk.frozen && !bk.future && !lastEndHighlight.some(h=>h.x===bk.x&&h.y===bk.y))
        lastEndHighlight.push({x:bk.x,y:bk.y,cls: winner==='black'?'result-ok':'result-hot'});

      const isPeace = /Примирение|мирное соглашение/i.test(lastEndReason||reason||'');
      document.getElementById('go-text').textContent=
        isPeace ? 'Примирение' : (winner==='white'?'Победа!':'Поражение...');
      const gr=document.getElementById('go-reason');
      if(gr) gr.textContent=lastEndReason;
      document.getElementById('game-over').classList.add('show');
      log(winner==='white'?'Победа!':'Поражение...');
      if(lastEndReason) log(lastEndReason.split('\n')[0]);
      haptic(winner==='white'?'success':'error'); render();
    }
    function showResultOnBoard(){
      document.getElementById('game-over').classList.remove('show');
      const ban=document.getElementById('result-banner');
      if(ban){
        ban.innerHTML = (lastEndWinner==='white'?'<b>Победа</b>':'<b>Поражение</b>')
          + '<br>' + (lastEndReason||'').replace(/\n/g,'<br>');
        ban.classList.add('show');
      }
      // re-render with kill highlights
      render();
      lastEndHighlight.forEach(h=>{
        const boardEl=document.getElementById('board');
        if(!boardEl) return;
        const cell=boardEl.children[h.y*boardW+h.x];
        if(cell) cell.classList.add(h.cls||'result-hot');
      });
    }
    document.getElementById('btn-show-result').onclick = showResultOnBoard;

    /** Neutral phase: one animated move, then afterMove continues the cycle. */
    function neutralTurn(){
      if(gameOver) return;
      turn='neutral';
      window._cardBusy=false; moving=false;
      const list=[];
      for(let y=0;y<boardH;y++) for(let x=0;x<boardW;x++){
        const p=board[y][x];
        if(p && isNeutral(p) && !p.boss && !p.red) list.push({x,y,p});
      }
      if(!list.length){
        if(bossMode) log('Нейтралов нет — дальше босс');
        else log('Нейтралов нет — пропуск');
        afterMove();
        return;
      }
      let chosen=null, pick=null, bestSc=-1;
      const shuffled=list.slice().sort(()=>Math.random()-0.5);
      for(const unit of shuffled){
        const moves=bossMode?getLegalMoves(unit.x,unit.y):getRawMoves(unit.x,unit.y);
        if(!moves.length) continue;
        for(const m of moves){
          let sc=1;
          if(bossMode){
            if(m.bossHit || isBossCell(m.x,m.y)) sc=100;
            else {
              const d=bossDistTo(m.x,m.y);
              sc=30-Math.abs(d-3)*5; // approach medium range / boss
            }
          } else {
            if(board[m.y][m.x]) sc=50;
          }
          if(sc>bestSc){ bestSc=sc; chosen=unit; pick=m; }
        }
        if(bestSc>=100) break;
      }
      if(!chosen||!pick){
        log('Нейтралы не могут ходить — пропуск');
        afterMove();
        return;
      }
      log('Ход нейтралов: '+describePiece(chosen.p)+' '+cellLabel(chosen.x,chosen.y)+' → '+cellLabel(pick.x,pick.y));
      render();
      animateAndMove(chosen.x, chosen.y, pick.x, pick.y, null);
    }

    function afterMove(){
      processFuture();
      processOffboard();
      turnCount++;
      if(turnCount===1){ showTip('first_move'); setTimeout(()=>showTip('camera'), 600); }
      if(!bossMode) maybeRandomResize();
      if(checkEnd()) return;

      if(turnCount>0 && turnCount%3===0 && !bossMode){
        const id=pickRandomCardId();
        const next=nextTurn(turn);
        if(next==='white') giveItem(id, false);
        else if(next==='black') giveItem(id, true);
      }

      if(extraMove && turn==='white' && !bossMode){
        extraMove=false;
        log('Доп. ход!');
        turn='white';
        selected=null; possibleMoves=[];
        rebuildAngelZones();
        render();
        return;
      }

      // Boss mode: white → black → neutral → boss → white
      if(bossMode){
        selected=null; possibleMoves=[];
        window._cardBusy=false; moving=false;
        // recover missing boss before continuing cycle
        if(!findBossPiece()){
          ensureBossPresent(()=>afterMove());
          return;
        }
        if(turn==='white'){
          turn='black';
          bossBudget={ movesLeft:4, attacksLeft:1, pieceUsed:{} };
          render();
          setTimeout(()=>{ try{ aiTurn(); }catch(e){ turn='neutral'; render(); setTimeout(neutralTurn, 300); } }, 400);
          return;
        }
        if(turn==='black'){
          turn='neutral';
          render();
          setTimeout(()=>{ try{ neutralTurn(); }catch(e){ console.error(e); afterMove(); } }, 350);
          return;
        }
        if(turn==='neutral'){
          // after neutral move, boss acts
          render();
          setTimeout(()=>{
            bossAITurn(()=>{
              if(gameOver) return;
              turn='white';
              bossBudget={ movesLeft:4, attacksLeft:1, pieceUsed:{} };
              rebuildAngelZones();
              render();
              if(whiteAIControl) setTimeout(()=>aiPlayWhiteBoss(), 400);
              else updateSkipBtn();
            });
          }, 300);
          return;
        }
        turn='white';
        bossBudget={ movesLeft:4, attacksLeft:1, pieceUsed:{} };
        render();
        if(whiteAIControl) setTimeout(()=>aiPlayWhiteBoss(), 400);
        else updateSkipBtn();
        return;
      }

      turn=nextTurn(turn);
      selected=null; possibleMoves=[];
      rebuildAngelZones();
      window._cardBusy=false; moving=false;
      render();
      if(gameOver) return;

      if(turn==='neutral'){
        setTimeout(()=>{ try{ neutralTurn(); }catch(e){ console.error(e); turn='white'; render(); } }, 380);
        return;
      }

      if(!hasAnyLegalMove(turn)){
        const k=findKing(turn);
        if(k && (k.frozen || k.future)){
          setTimeout(()=>passTurn(turn==='white'?'Белый король вне поля — пропуск':'Король ИИ вне поля — пропуск', true), 500);
          return;
        }
        if(checkEnd()) return;
      }
      if(turn==='black'){
        setTimeout(()=>{ try{ aiTurn(); }catch(e){ console.error(e); turn='neutral'; moving=false; window._cardBusy=false; render(); setTimeout(neutralTurn, 300); } }, 420);
      } else {
        updateSkipBtn();
      }
    }


    document.getElementById('dbg-btn').onclick = () => {
      try{ document.getElementById('cmd-panel').classList.remove('show'); }catch(e){}
      document.getElementById('dbg-panel').classList.toggle('show');
    };
    (function bindCmdAndInspect(){
      if(typeof inspectMode==='undefined') window.inspectMode=false;
      const cmdBtn=document.getElementById('cmd-btn');
      const cmdPanel=document.getElementById('cmd-panel');
      const cmdInput=document.getElementById('cmd-input');
      const cmdRun=document.getElementById('cmd-run-btn');
      const insp=document.getElementById('inspect-btn');
      if(insp){
        insp.onclick=()=>{
          inspectMode=!inspectMode;
          insp.classList.toggle('on', inspectMode);
          try{ log(inspectMode?'Осмотр ВКЛ: тап по фигуре или карте':'Осмотр выкл'); }catch(e){}
        };
      }
      if(cmdBtn&&cmdPanel){
        cmdBtn.onclick=()=>{
          try{ document.getElementById('dbg-panel').classList.remove('show'); }catch(e){}
          cmdPanel.classList.toggle('show');
          if(cmdPanel.classList.contains('show')&&cmdInput) setTimeout(()=>cmdInput.focus(),40);
        };
        function submit(){
          const code=(cmdInput&&cmdInput.value||'').trim();
          if(code && typeof runPlayerCode==='function') runPlayerCode(code);
          else if(code && typeof runDebug==='function') runDebug(code);
          if(cmdInput) cmdInput.value='';
          cmdPanel.classList.remove('show');
        }
        if(cmdRun) cmdRun.onclick=submit;
        if(cmdInput) cmdInput.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); submit(); }});
        cmdPanel.querySelectorAll('.cmd-hints [data-cmd]').forEach(b=>{
          b.onclick=()=>{
            const c=b.getAttribute('data-cmd');
            if(typeof runPlayerCode==='function') runPlayerCode(c);
            cmdPanel.classList.remove('show');
          };
        });
      }
      // ensure runPlayerCode exists

function walk(t){
  const list=[];each((p,x,y)=>{if(p.t===t&&!valid(x,y)&&!p.jail&&!p.shot)list.push({p,x,y});});
  list.forEach(({p,x,y})=>{
    let best=null,bd=1e9;
    for(let j=0;j<WN;j++)for(let i=0;i<WN;i++)if(valid(i,j)){const d=Math.abs(i-x)+Math.abs(j-y);if(d<bd){bd=d;best=[i,j];}}
    if(!best)return;
    const dx=Math.sign(best[0]-x),dy=Math.sign(best[1]-y);
    const c=Math.abs(best[0]-x)>=Math.abs(best[1]-y)?[[dx,0],[0,dy]]:[[0,dy],[dx,0]];
    for(const [sx,sy] of c){
      if(!sx&&!sy)continue;const nx=x+sx,ny=y+sy;if(!inW(nx,ny))continue;
      const q=B[ny][nx];
      if(q&&(!valid(nx,ny)||!enemy(q,p)))continue;
      B[y][x]=null;B[ny][nx]=p;if(valid(nx,ny))promoteIf(p,nx,ny);break;
    }
  });
}

function aiPickMove(t,ms){
  const kp0=kingPos(t),inCheck=!!(kp0&&attacked(kp0.x,kp0.y,t));
  const hangMemo=new Map();

    const key=x+','+y;if(hangMemo.has(key))return hangMemo.get(key);

    if(at.length){if(!isDefended(x,y,t))v=VALS[p.k]||1;else v=Math.max(0,(VALS[p.k]||1)-Math.min(...at.map(a=>VALS[a.k]||1)));}

    if(m.shoot){const tq=B[m.cap.y][m.cap.x];if(tq){const s0=Math.random()*0.7+(tq.k==='K'?5000:(VALS[tq.k]||1)*10+6);if(s0>bs){bs=s0;best=m;}}return;}
    const cp=m.cap&&B[m.cap.y][m.cap.x];
    const wasHang=p.k==='K'?0:hangNow(m.fx,m.fy,p);
    // пробный ход на доске
    const snap=[];const save=(x,y)=>snap.push([x,y,B[y][x]]);
    save(m.fx,m.fy);save(m.x,m.y);if(m.cap)save(m.cap.x,m.cap.y);
    let rk=null;if(m.castle){rk=B[m.castle.ry][m.castle.rx];save(m.castle.rx,m.castle.ry);save(m.castle.tx,m.castle.ty);}
    const target=B[m.y][m.x];

    B[m.y][m.x]=m.merge&&target?mergeP(p,target):p;
    if(m.castle){B[m.castle.ry][m.castle.rx]=null;B[m.castle.ty][m.castle.tx]=rk;}
    const kp=p.k==='K'?{x:m.x,y:m.y}:kp0;

      if(at.length){landHang=isDefended(m.x,m.y,t)?Math.max(0,(VALS[p.k]||1)-Math.min(...at.map(a=>VALS[a.k]||1))):(VALS[p.k]||1);}

    if(!safe)sc-=4000;                 // оставить короля под ударом нельзя
    if(inCheck&&safe)sc+=400;          // вышел из-под шаха
    if(cp)sc+=cp.k==='K'?5000:(cp.boss?0:(VALS[cp.k]||1)*10);
    sc-=landHang*9;                    // не подставлять фигуру

    if(p.k==='P'||p.k==='m')sc+=fw*0.25;else sc+=fw*0.08;

  });

}

    ()=>{const c=pick(free()),t=pick(ORDER.filter(alive));if(!c)return;const chess=t==='white'||t==='black';B[c[1]][c[0]]={t,k:chess?pick(['P','N','B','R']):'m',st:0};return 'Из ниоткуда появилась фигура: '+NAME[t];},
    ()=>{const a=pcs(p=>p.k!=='K');if(!a.length)return;const z=pick(a);burry(z.p,z.x,z.y);B[z.y][z.x]=null;return 'Исчезла фигура ('+NAME[z.p.t]+')';},
    ()=>{const a=pcs(),c=pick(free());if(!a.length||!c)return;const z=pick(a);B[z.y][z.x]=null;B[c[1]][c[0]]=z.p;return 'Фигура ('+NAME[z.p.t]+') телепортировалась';},
    ()=>{const a=pcs(p=>p.k==='P'||p.k==='m'||p.k==='N'||p.k==='B'||p.k==='R');if(!a.length)return;const z=pick(a);z.p.k=z.p.k==='m'?'d':'Q';return 'Фигура ('+NAME[z.p.t]+') возвысилась';},
    ()=>{const a=pcs(p=>p.k==='Q'||p.k==='d');if(!a.length)return;const z=pick(a);z.p.k=z.p.k==='d'?'m':'P';z.p.st=0;return 'Фигура ('+NAME[z.p.t]+') разжалована';},
    ()=>{const a=pcs(p=>p.k!=='K');if(!a.length)return;const z=pick(a),to=pick(ORDER.filter(u=>u!==z.p.t&&alive(u)&&(RULE[u]==='chess')===(RULE[z.p.t]==='chess')));if(!to)return;z.p.t=to;return 'Фигура перешла на другую сторону';},
    ()=>{const a=pcs();if(a.length<2)return;const u=pick(a),v=pick(a.filter(z=>z!==u));B[u.y][u.x]=v.p;B[v.y][v.x]=u.p;return 'Две фигуры поменялись местами';},
    ()=>mutate(),
    ()=>{const tt=pick(ORDER.filter(alive));if(Math.random()<0.5){CS[tt]=[null,null,null];return 'У стороны «'+NAME[tt]+'» сгорели все карты';}giveCard(tt);giveCard(tt);return 'Сторона «'+NAME[tt]+'» получила карты';},
    ()=>{extra=true;return 'Дополнительный ход!';},
    ()=>{const t=pick(ORDER.filter(z=>z!==who&&alive(z)));if(!t)return;skipT=t;return 'Следующий ход пропустят: '+NAME[t];}
  ];
  const order=effects.map((e,i)=>i).sort(()=>Math.random()-0.5);
  for(const i of order){const r=effects[i]();if(r)return r;}
  return 'Ничего не произошло';
}

function bossFits(x,y){for(let j=0;j<3;j++)for(let i=0;i<3;i++){if(!valid(x+i,y+j))return false;const q=B[y+j][x+i];if(q&&q.prot)return false;}return true;}
function placeBoss(x,y){
  if(bossSt)for(let j=0;j<3;j++)for(let i=0;i<3;i++){const q=B[bossSt.y+j][bossSt.x+i];if(q&&q.boss)B[bossSt.y+j][bossSt.x+i]=null;}
  for(let j=0;j<3;j++)for(let i=0;i<3;i++){
    const q=B[y+j][x+i];
    if(q&&!q.boss){burry(q,x+i,y+j);B[y+j][x+i]=null;log('Босс раздавил фигуру ('+(NAME[q.t]||'миньон')+')');}
    B[y+j][x+i]={t:'boss',k:'X',boss:true,center:i===1&&j===1};
  }
  if(bossSt){bossSt.x=x;bossSt.y=y;}
}
function spawnBoss(cx,cy){
  let bx=cx-1,by=cy-1,best=null,bd=1e9;
  for(let y=0;y<WN;y++)for(let x=0;x<WN;x++)if(bossFits(x,y)){const d=Math.abs(x-bx)+Math.abs(y-by);if(d<bd){bd=d;best=[x,y];}}
  bossSt={x:best[0],y:best[1],hp:20,max:20,p2:false,hand:2,elite:0};
  placeBoss(best[0],best[1]);
  log('БОСС-ФАЙТ! Босс 3×3, 20 ударов. Бейте его любыми фигурами!');
  draw();
  forceTetoSay('В центре поля поднялся босс. Побеждать друг друга уже не так важно — выживите и сразите его! Босс не двигается, но каждый ход призывает приспешников картами.',()=>{
    busy=false;check();if(!over)advance();
  });
}
function hitBoss(){
  if(!bossSt)return;
  bossSt.hp--;log('Удар по боссу! HP '+bossSt.hp+'/'+bossSt.max);
  if(!bossSt.p2&&bossSt.hp>0&&bossSt.hp<=5){bossSt.p2=true;bossSt.elite=1;log('2-я фаза! Каждая карта призывает по 2 приспешника, плюс каждый ход 3-я карта — «Призыв элиты»');forceTetoSay('Босс в ярости! Теперь его карты призывают вдвое больше приспешников, а каждый ход он получает ещё одну карту — призыв элитной фигуры.',()=>{});}
  if(bossSt.hp<=0){
    each((q,x,y)=>{if(q.t==='boss')B[y][x]=null;});bossSt=null;
    over=true;
    document.getElementById('go-text').textContent='Примирение';

  }

function nearestEnemy(x,y){
  let best=null,bd=1e9;
  each((q,a,b)=>{if(q.t!=='boss'&&q.k!=='J'&&!q.wall&&valid(a,b)){const d=Math.abs(a-x)+Math.abs(b-y);if(d<bd){bd=d;best={x:a,y:b,d};}}});
  return best;
}
function bossTurn(){
  if(!bossSt||over)return;
  // босс не двигается; ходят только его приспешники
  const mins=[];each((q,x,y)=>{if(q.minion&&valid(x,y))mins.push({q,x,y});});
  const stepMin=(q,x,y)=>{
    const tg=nearestEnemy(x,y);if(!tg)return null;
    const dx=Math.sign(tg.x-x),dy=Math.sign(tg.y-y);
    for(const [sx,sy] of (Math.abs(tg.x-x)>=Math.abs(tg.y-y)?[[dx,0],[0,dy]]:[[0,dy],[dx,0]])){
      if(!sx&&!sy)continue;const nx=x+sx,ny=y+sy;if(!valid(nx,ny))continue;const o=B[ny][nx];
      if(o&&(o.t==='boss'||o.prot))continue;
      if(o){burry(o,nx,ny);log('Красный '+(q.elite?'элитный ':'')+'приспешник съел фигуру ('+(NAME[o.t]||'приспешник')+')');}
      B[y][x]=null;B[ny][nx]=q;return [nx,ny];
    }
    return null;
  };
  mins.forEach(({q,x,y})=>{let c=[x,y];for(let s=0;s<(q.elite?2:1)&&c;s++)c=stepMin(q,c[0],c[1]);});
  // карты босса разыгрываются в его ход, потом выдаются новые
  const near=()=>freeCells().filter(c=>Math.abs(c[0]-bossSt.x-1)+Math.abs(c[1]-bossSt.y-1)<=5);
  const per=bossSt.p2?2:1;let spawned=0,elite=0;
  for(let i=0;i<(bossSt.hand||0);i++){
    for(let j=0;j<per;j++){const n=near();if(!n.length)break;const c=pick(n);B[c[1]][c[0]]={t:'boss',k:'m',red:true,minion:true};spawned++;}
  }
  if(bossSt.elite){
    const n=near();
    if(n.length){const c=pick(n);B[c[1]][c[0]]={t:'boss',k:'Q',red:true,minion:true,elite:true};elite++;}
  }
  bossSt.hand=2;bossSt.elite=bossSt.p2?1:0;
  if(spawned||elite)log('Босс разыграл карты: приспешников '+spawned+(elite?', элитная фигура ×1':''));
}

function loadPeerSDK(){
  return new Promise((resolve, reject)=>{
    if(window.Peer){ resolve(); return; }
    const urls = [
      'https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js',
      'https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js'
    ];
    let i = 0;
    const next = ()=>{
      if(i >= urls.length){ reject(new Error('Не удалось загрузить PeerJS. Проверь интернет.')); return; }
      const s = document.createElement('script');
      s.src = urls[i++];
      s.onload = ()=> window.Peer ? resolve() : next();
      s.onerror = ()=>{ s.remove(); next(); };
      document.head.appendChild(s);
    };
    next();
  });
}
function netErr(e){
  if(e instanceof Error && !e.type) return e;
  const t = e && e.type;
  if(t === 'peer-unavailable') return new Error('Комната не найдена (проверь код)');
  if(t === 'unavailable-id') return new Error('Код занят, попробуй ещё раз');
  if(t === 'network' || t === 'server-error' || t === 'socket-error' || t === 'socket-closed') return new Error('Нет связи с сервером PeerJS. Проверь интернет и повтори.');
  if(t === 'browser-incompatible') return new Error('Браузер не поддерживает WebRTC');
  return new Error((e && (e.message || e.type)) || 'Ошибка сети');
}
function openPeer(id){
  return new Promise((resolve, reject)=>{
    let done = false;
    const p = id ? new Peer(id, PEER_OPTS) : new Peer(PEER_OPTS);
    const to = setTimeout(()=>{ if(done) return; done = true; try{ p.destroy(); }catch(e){} reject(new Error('Сервер соединения не отвечает. Повтори позже.')); }, 12000);
    p.on('open', ()=>{ if(done) return; done = true; clearTimeout(to); resolve(p); });
    p.on('error', err=>{ if(done){ console.warn('peer', err); return; } done = true; clearTimeout(to); try{ p.destroy(); }catch(e){} reject(err); });
  });
}
